  const c=document.querySelector('.content');if(c&&cs!=null)c.scrollTop=cs;const pb=document.querySelector('.pb');if(pb&&ps!=null)pb.scrollTop=ps;const db=document.querySelector('.db');if(db&&ds!=null)db.scrollTop=ds;
  if(fid_){const el=document.getElementById(fid_);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(s0!=null)el.setSelectionRange(s0,s1)}catch(e){}}}
  const qm=new Map();ui.pend.forEach(([id,t])=>{if(document.getElementById(id))qm.set(id,t)});ui.pend=[...qm];
  ui.pend.forEach(([id,txt])=>{const el=document.getElementById(id);if(!el)return;el.innerHTML='';
    if(window.QRCode){try{new QRCode(el,{text:txt,width:164,height:164,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.innerHTML=`<div class="code">${esc(txt)}</div>`}}else el.innerHTML=`<div class="code" style="max-width:180px;word-break:break-all">${esc(txt)}</div>`});
  const cv=document.getElementById('sigc');if(cv)sigPad(cv);
}
function sigPad(cv){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;ui.ink=false;let dn=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{dn=true;cv.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b)});
  cv.addEventListener('pointermove',e=>{if(!dn)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke();ui.ink=true});
  const up=()=>{dn=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}

/* ===== API ADAPTER ===== */

/* ================= เชื่อมต่อระบบหลังบ้าน (Google Apps Script) =================
   ถ้า API_URL ว่าง ระบบจะทำงานแบบทดลอง (เก็บข้อมูลในเครื่อง) เหมือนเดิม      */
const API_URL = window.JS_API_URL || '';
/* /apply = พอร์ทัลผู้สมัครอย่างเดียว (ลิงก์สำหรับ LINE OA) */
const APPLY_ONLY = /(^|\/)apply(\/(index\.html)?)?$/i.test(location.pathname) || /[?&]apply\b/.test(location.search) || location.hash === '#apply';
const LIVE = !!API_URL;
const NET = { tokenHr: null, tokenAp: null, user: null, snap: {}, busy: false, dirty: false };
const SYNCT = ['sites','cands','slots','bookings','vac','mpr','deploys','transfers','blacklist','blr','sigs','notifs','activity','audit','templates'];

async function api(action, data, token) {
  if (window.__MOCK_API) return window.__MOCK_API(action, data, token);
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, data: data || {}, token: token || '' })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'ระบบขัดข้อง');
  return j.data;
}

/* ---------- ฝั่งฝ่ายบุคคล ---------- */
function stateFromServer(d) {
  const base = { v: 1, seq: {}, sites: [], cands: [], slots: [], bookings: [], mpr: [], vac: [],
    deploys: [], transfers: [], blacklist: [], blr: [], sigs: [], notifs: [], audit: [],
    activity: [], drafts: {}, settings: {}, targets: {}, srcCost: {}, templates: [] };
  SYNCT.forEach(t => { if (Array.isArray(d[t])) base[t] = d[t]; });
  Object.assign(base, d.config || {});
  base.settings = Object.assign({}, (typeof S !== 'undefined' && S ? S.settings : {}), base.settings || {});
  applyMaster(base, d.master || []);
  return base;
}
function applyMaster(st, master) {
  const sites = master.filter(m => m.type === 'site');
  if (sites.length) st.sites = sites.map(m => Object.assign({ id: m.code, name: m.name, co: m.co }, m.detail));
  master.filter(m => m.type === 'position').forEach(m => {
    POS[m.code] = Object.assign({ n: m.name, wage: 0, unit: 'วัน', docs: [] }, POS[m.code] || {}, m.detail || {});
    if (m.name) POS[m.code].n = m.name;
  });
}
function snapshot() {
  NET.snap = {};
  SYNCT.forEach(t => {
    NET.snap[t] = {};
    (S[t] || []).forEach(r => { if (r && r.id) NET.snap[t][r.id] = JSON.stringify(r); });
  });
}
function dirtyOps() {
  const ops = [];
  SYNCT.forEach(t => {
    const seen = {};
    (S[t] || []).forEach(r => {
      if (!r) return;
      if (!r.id) r.id = t.toUpperCase().slice(0, 3) + '-' + Math.random().toString(36).slice(2, 10);
      seen[r.id] = 1;
      const s = JSON.stringify(r);
      if (NET.snap[t] && NET.snap[t][r.id] === s) return;
      ops.push({ t, id: r.id, rec: r });
    });
    Object.keys(NET.snap[t] || {}).forEach(id => { if (!seen[id]) ops.push({ t, id, del: true }); });
  });
  return ops;
}
let pushTimer = null;
function pushSoon() {
  NET.dirty = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 800);
}
async function pushNow() {
  if (!LIVE || !NET.tokenHr || NET.busy) return;
  const ops = dirtyOps();
  const cfg = { settings: S.settings, targets: S.targets, srcCost: S.srcCost, seq: S.seq };
  if (!ops.length && !NET.dirty) return;
  NET.busy = true;
  try {
    await api('hr.save', { ops, config: cfg }, NET.tokenHr);
    snapshot();
    NET.dirty = false;
  } catch (e) {
    toast('บันทึกไม่สำเร็จ: ' + e.message, 'bad');
  } finally { NET.busy = false; }
}

function wipeAll() {
  ['sites','cands','slots','bookings','vac','mpr','deploys','transfers','blacklist','blr',
   'sigs','notifs','activity','audit','templates','documents'].forEach(k => { S[k] = []; });
  S.drafts = {}; S.targets = {}; S.srcCost = {}; S.seq = {};
  Object.keys(POS).forEach(k => { delete POS[k]; });
  if (typeof DEMO !== 'undefined') DEMO.length = 0;
}

function portalState(d) {
  const p = P();
  S.slots = d.slots || [];
  S.vac = d.vac || [];
  S.bookings = d.bookings || [];
  S.cands = d.cand ? [d.cand] : [];
  S.documents = d.documents || [];
  if (d.settings && Object.keys(d.settings).length) S.settings = Object.assign({}, S.settings, d.settings);
  applyMaster(S, d.master || []);
  p.cand = d.cand ? d.cand.id : null;
  if (d.draft) { S.drafts = S.drafts || {}; S.drafts[p.phone] = d.draft; }
}

  const orig = A[name];

}

/* ย่อรูปก่อนอัปโหลด แล้วส่งขึ้น Drive */
function shrink(file, maxPx = 1600, q = 0.7) {
  return new Promise((res, rej) => {
    if (file.type === 'application/pdf') {
      const fr = new FileReader();
      fr.onload = () => res({ base64: String(fr.result).split(',')[1], mime: 'application/pdf' });
      fr.onerror = rej; fr.readAsDataURL(file);
      return;
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxPx / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res({ base64: cv.toDataURL('image/jpeg', q).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = rej; img.src = url;
  });
}

A.pUpload = async (type, input) => {

  const maxMB = Number((S.settings || {}).maxMB || 10);
  if (file.size > maxMB * 1024 * 1024 && file.type === 'application/pdf') { toast('ไฟล์ใหญ่เกิน ' + maxMB + ' MB', 'bad'); return; }
  if (!LIVE) { toast('โหมดทดลอง: บันทึกเอกสารจำลองแล้ว', 'ok'); return; }
  try {
    toast('กำลังส่งเอกสาร…');
    const { base64, mime } = await shrink(file);
    await api('ap.upload', { type, base64, mime }, NET.tokenAp);
    await apRefresh(); render();
    toast('ส่งเอกสารเรียบร้อย', 'ok');
  } catch (e) { toast('ส่งเอกสารไม่สำเร็จ: ' + e.message, 'bad'); }
};
