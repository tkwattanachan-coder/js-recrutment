index.html — คลิกในกล่อง แล้วกด Ctrl+A ตามด้วย Ctrl+C
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ศูนย์บุคลากรและกำลังคน JS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#F6F8FA;--ink:#16212C;--muted:#5A6978;--line:#DDE3E9;
  --brand:#0E3A55;--brand-ink:#FFFFFF;--brand-soft:#E3EDF3;--link:#1C6386;
  --side:#0E3A55;--side-ink:#E8F0F5;--side-muted:#9DB8C9;--side-hover:rgba(255,255,255,.07);--side-active:rgba(242,178,51,.16);
  --hero:#0E3A55;--hero-ink:#F4F8FB;--hero-muted:#A9C3D3;--mark:#F2B233;
  --ok:#1E8455;--ok-bg:#E2F3E9;--warn:#96700A;--warn-bg:#FAF1D3;--attn:#BF5E16;--attn-bg:#FCEADB;
  --bad:#BE3228;--bad-bg:#FBE3E0;--off:#6F7C88;--off-bg:#ECEFF2;--info:#2A64A8;--info-bg:#E2ECF8;
  --shadow:0 1px 2px rgba(14,58,85,.05),0 6px 18px rgba(14,58,85,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C;--surface:#16202A;--surface-2:#1B2733;--ink:#E4EBF1;--muted:#97A5B2;--line:#283643;
  --brand:#8FC3DE;--brand-ink:#0E151C;--brand-soft:#1C3242;--link:#8CC2E0;
  --side:#0B1219;--side-ink:#DCE6EE;--side-muted:#7F95A6;--hero:#123246;--hero-ink:#F1F6FA;--hero-muted:#9DB8C9;
  --ok:#5CC48E;--ok-bg:#15301F;--warn:#E2BE4C;--warn-bg:#2F2813;--attn:#EF9C58;--attn-bg:#35220F;
  --bad:#F27D71;--bad-bg:#3A1A17;--off:#8E9AA6;--off-bg:#222D37;--info:#80B1EA;--info-bg:#172A40;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0E151C;--surface:#16202A;--surface-2:#1B2733;--ink:#E4EBF1;--muted:#97A5B2;--line:#283643;
  --brand:#8FC3DE;--brand-ink:#0E151C;--brand-soft:#1C3242;--link:#8CC2E0;
  --side:#0B1219;--side-ink:#DCE6EE;--side-muted:#7F95A6;--hero:#123246;--hero-ink:#F1F6FA;--hero-muted:#9DB8C9;
  --ok:#5CC48E;--ok-bg:#15301F;--warn:#E2BE4C;--warn-bg:#2F2813;--attn:#EF9C58;--attn-bg:#35220F;
  --bad:#F27D71;--bad-bg:#3A1A17;--off:#8E9AA6;--off-bg:#222D37;--info:#80B1EA;--info-bg:#172A40;--shadow:none}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,system-ui,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
a{color:var(--link)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
.muted{color:var(--muted)}.sm{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.stack>*+*{margin-top:12px}
/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
.shell.col{grid-template-columns:68px minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;z-index:30}
.brand{padding:16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--mark);color:#0E3A55;font-weight:700;display:grid;place-items:center;flex:none;font-size:14px;letter-spacing:.5px}
.brand b{display:block;font-size:13.5px;letter-spacing:.3px}.brand small{color:var(--side-muted);font-size:11.5px}
.nav{overflow-y:auto;padding:8px 8px 24px;flex:1}
.ng{margin-top:2px}
.ngh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;text-align:left}
.ngh:hover{background:var(--side-hover)}
.ngh svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.85}
.ngh .car{margin-left:auto;opacity:.5;font-size:11px}
.ni{display:block;width:100%;text-align:left;background:none;border:0;color:var(--side-muted);padding:6px 10px 6px 38px;border-radius:7px;cursor:pointer;font-size:13px}
.ni:hover{color:var(--side-ink);background:var(--side-hover)}
.ni.on{color:var(--side-ink);background:var(--side-active);box-shadow:inset 3px 0 0 var(--mark)}
.shell.col .brand div,.shell.col .ni,.shell.col .ngh span,.shell.col .ngh .car{display:none}
.shell.col .ngh{justify-content:center}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
.top .ttl b{display:block;font-size:14px;letter-spacing:.4px}.top .ttl small{color:var(--muted);font-size:11.5px}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.ib .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.gs{position:relative;flex:1;max-width:420px}
.gs input{width:100%}
.gsr{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:40}
.gsr button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.gsr button:hover{background:var(--surface-2)}
.content{overflow:auto;flex:1;padding:22px 26px 48px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
/* controls */
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;min-height:36px;width:100%}
select.in{padding-right:28px}
.in.auto{width:auto}
.lab{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--bad);border-color:var(--bad)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.s{padding:3px 10px;font-size:12.5px;min-height:28px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.b{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--ok)}.b.warn{background:var(--warn-bg);color:var(--warn)}.b.attn{background:var(--attn-bg);color:var(--attn)}
.b.bad{background:var(--bad-bg);color:var(--bad)}.b.off{background:var(--off-bg);color:var(--off)}.b.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>.ch{margin-bottom:12px}
.ch{display:flex;align-items:center;gap:10px}
.ch h2{margin:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;border-left:4px solid var(--line)}
.kpi:hover{background:var(--surface-2)}
.kpi .l{font-size:12.5px;color:var(--muted)}.kpi .v{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.attn{border-left-color:var(--attn)}.kpi.bad{border-left-color:var(--bad)}.kpi.info{border-left-color:var(--info)}.kpi.off{border-left-color:var(--off)}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-bottom:16px}
.hero h1{font-size:26px;font-weight:600;line-height:1.35}
.hero .hs{color:var(--hero-muted);font-size:13.5px;margin-top:8px}
.hstats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.hstats div b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.hstats div span{font-size:12.5px;color:var(--hero-muted)}
.strip{display:grid;gap:7px;align-content:start}
.srow{display:grid;grid-template-columns:128px 1fr 56px;gap:10px;align-items:center;font-size:12.5px;cursor:pointer}
.srow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--hero-muted)}
.sbar{height:9px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:5px}
.lv-ok{background:#4CC38A}.lv-warn{background:#E9C340}.lv-attn{background:#F0913F}.lv-bad{background:#F0655A}
/* funnel & bars */
.fun{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.fbar{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--brand);opacity:.85;border-radius:6px}
.pbar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--ok)}
/* tables */
.dtbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.dtbar .in{max-width:260px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:var(--surface-2)}
.pg{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}
details.cv{position:relative}
details.cv summary{list-style:none}details.cv summary::-webkit-details-marker{display:none}
details.cv .menu{position:absolute;right:0;top:34px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;z-index:15;box-shadow:var(--shadow);min-width:180px}
details.cv .menu label{display:block;padding:3px 0;font-size:13px;white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
/* lists */
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;flex:none;font-size:13px}
.tlv{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tlv div{position:relative;padding:4px 0 10px}
.tlv div:before{content:"";position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center}
.filters select{width:auto;min-width:130px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -20px 14px;padding:0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 13px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box.int{border-color:var(--attn);background:var(--attn-bg)}
.box.pub{border-color:var(--info);background:var(--info-bg)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kc{flex:0 0 230px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:300px}
.kc.over{outline:2px dashed var(--link)}
.kc h3{font-size:13.5px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:grab;font-size:13px}
.kcard b{display:block}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.42);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:51;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:16px 20px 0}
.db{padding:0 20px 30px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);border-radius:14px;z-index:61;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mb{padding:14px 20px;overflow:auto}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ov.m{z-index:60}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:grid;gap:8px}
#toast div{background:#16212C;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
#toast div.bad{background:#9E2A22}#toast div.ok{background:#1B6E48}
.qr{display:inline-block;background:#fff;padding:8px;border-radius:8px}
canvas.sig{width:100%;height:150px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none}
.score{display:flex;gap:4px}.score button{width:34px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer}
.score button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px}
.cald{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:140px;font-size:12.5px}
.cald.today{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.ce{border-radius:6px;padding:3px 7px;margin-top:5px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto}
/* portal */
.pw{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px;overflow:auto}
.pside{width:300px;flex:none}
.phone{width:392px;height:min(820px,calc(100% - 10px));min-height:620px;border-radius:38px;border:10px solid #1A2530;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;flex:none;box-shadow:0 30px 60px rgba(14,58,85,.25)}
.phd{background:var(--hero);color:var(--hero-ink);padding:14px 18px 12px;display:flex;align-items:center;gap:10px}
.phd b{font-size:14px}.phd small{color:var(--hero-muted);font-size:11.5px;display:block}
.pb{flex:1;overflow:auto;padding:16px}
.pnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
.pnav button{border:0;background:none;padding:8px 0 10px;font-size:11.5px;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px;position:relative}
.pnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.pnav button.on{color:var(--brand)}
.pnav .dot{position:absolute;top:5px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.pbtn{width:100%;padding:13px 16px;font-size:15.5px;border-radius:12px;min-height:50px}
.ptodo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--attn-bg);color:var(--ink);border:0;width:100%;text-align:left;cursor:pointer;margin-top:8px;font-size:14.5px}
.ptodo b{color:var(--attn);font-size:18px}
.steps{display:flex;gap:4px;margin:4px 0 14px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.pin{font-size:16px;min-height:46px;border-radius:10px}
.slot{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.slot.on{border-color:var(--brand);background:var(--brand-soft)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg label{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;background:var(--surface)}
.tg input{display:none}.tg input:checked+span{color:var(--brand);font-weight:600}
.mswitch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell,.shell.col{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:272px;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .shell.navo .side{transform:none}
  .shell.col .brand div,.shell.col .ni,.shell.col .ngh span,.shell.col .ngh .car{display:revert}
  .g2,.g3{grid-template-columns:1fr}
  .content{padding:16px 14px 90px}

/* ---------- matching (แนะนำเท่านั้น) ---------- */
function matchVac(c,excludePos){
  const out=[];
  S.vac.filter(v=>v.st==='เปิดรับ'&&v.pos!==excludePos).forEach(v=>{
    const s=siteOf(v.site);const p=POS[v.pos];let sc=0;const why=[],gapL=[];
    if(s.area===c.area||s.area===c.prefArea){sc+=25;why.push('อยู่ในพื้นที่ที่สะดวก')}else gapL.push('ต่างพื้นที่');
    const grp=c.apps.map(a=>POS[a.pos]?.g);const expTxt=c.exp.map(e=>e.pos).join(' ');
    if(grp.includes(p.g)||expTxt.includes(p.n.replace('หัวหน้าทีม','').replace('หัวหน้าชุด ',''))){sc+=25;why.push('ประสบการณ์สายงานเดียวกัน')}
    if(p.g==='sec'){if(c.skills.includes('ใบอนุญาต รปภ.')||['approved','expiring'].includes(docSt(c.docs.sglic))){sc+=15;why.push('มีใบอนุญาต รปภ.')}else gapL.push('ยังไม่มีใบอนุญาต รปภ.')}else sc+=15;
    if(p.docs.includes('drv')){if(c.skills.includes('ขับรถยนต์')){sc+=5;why.push('ขับรถยนต์ได้')}else gapL.push('ต้องมีใบขับขี่')}else sc+=5;
    if(/12 ชม|กลางคืน/.test(s.shift)){if(c.night){sc+=10;why.push('ทำกะดึกได้')}else gapL.push('กะไม่ตรง')}else sc+=10;
    if(v.wage>=c.expect||p.unit.includes('เดือน')){sc+=10;why.push('ค่าจ้างตรงความคาดหวัง')}else gapL.push('ค่าจ้างต่ำกว่าที่คาด');
    const dp=docProg(c,v.pos).pct;sc+=Math.round(dp/10);
    if(c.apps.some(a=>a.eval&&/เหมาะกับตำแหน่ง/.test(a.eval.comment||'')&&(a.eval.comment||'').includes(p.n))){sc+=10;why.push('ผู้สัมภาษณ์แนะนำ')}
    out.push({v,s,sc:Math.min(sc,100),why,gap:gapL});
  });
  return out.sort((a,b)=>b.sc-a.sc);
}
function siteMatch(c){
  const a=cur(c);return S.sites.filter(s=>s.req[a.pos]).map(s=>{let sc=0;const why=[];const gap=s.req[a.pos]-s.cur[a.pos];
    if(gap>0){sc+=30;why.push(`ขาด ${gap} อัตรา`)}
    if(s.area===c.area){sc+=30;why.push('ใกล้ที่พัก')}else if(s.area===c.prefArea){sc+=20;why.push('พื้นที่ที่ต้องการ')}
    if(!/กลางคืน/.test(s.shift)||c.night){sc+=15;why.push('กะตรง')}
    if(s.id===a.site){sc+=15;why.push('หน่วยงาน ที่สมัคร')}
    if(!s.note||docProg(c).pct===100){sc+=10}
    return {s,sc,why,gap,note:s.note}}).sort((x,y)=>y.sc-x.sc);
}

function deployMissing(c){
  const m=[];const a=cur(c);
  docProg(c,a.pos).missing.forEach(k=>m.push(`เอกสาร: ${DOCS[k]} (${DST[docSt(c.docs[k])][0]})`));
  if(!c.hire||c.hire.st!=='อนุมัติแล้ว')m.push('ยังไม่ผ่านการอนุมัติจ้าง');
  if(!['passed'].includes(a.result))m.push('ยังไม่มีผลสัมภาษณ์ผ่าน');
  const on=onbItems(c).filter(i=>!i.done);on.forEach(i=>m.push(`เตรียมเริ่มงาน: ${i.t}`));
  return [...new Set(m)];
}

/* ---------- booking with slot lock ---------- */
let slotLock=false;
function bookSlot(cid,slotId){
  if(slotLock)return {ok:false,msg:'มีผู้ใช้กำลังจองรอบนี้ กรุณาลองอีกครั้ง'};
  slotLock=true; // transaction: ตรวจความจุภายใต้ lock
  try{
    const c=candOf(cid),a=cur(c),sl=slotOf(slotId);
    if(!sl||!['open','nearly'].includes(slotSt(sl)))return {ok:false,msg:'รอบนี้เต็มหรือปิดแล้ว กรุณาเลือกรอบอื่น'};
    if(slotBooked(sl)>=sl.cap)return {ok:false,msg:'รอบนี้เต็มแล้ว'};
    if(!['eligible'].includes(a.status))return {ok:false,msg:'สถานะใบสมัครยังเลือกวันสัมภาษณ์ไม่ได้'};
    const prev=S.bookings.find(b=>b.app===a.no&&b.att==='resched'&&!b.moved);
    const b={id:nextId('INT'),cand:c.id,app:a.no,slot:sl.id,att:'waiting',at:now(),checkin:null,resched:prev?prev.resched:0,hist:[]};
    if(prev){prev.moved=b.id;b.hist.push({from:prev.slot,to:sl.id,at:now(),reason:prev.reason})}
    S.bookings.push(b);setSt(c,a,'booked',`จอง ${b.id}`);
    act(`ยืนยันนัดสัมภาษณ์: ${fullName(c)} ${fDay(sl.date)} ${sl.start}`,'info');notify(`จองสัมภาษณ์: ${fullName(c)} — ${fDay(sl.date)} ${sl.start}`);
    c.msgs.unshift({at:now(),by:'ระบบ',text:`ยืนยันนัดสัมภาษณ์ ${fDay(sl.date)} ${sl.start} น. ที่ ${sl.loc} (เลขที่นัด ${b.id})`});
    if(slotSt(sl)==='full'){log('ปิดรอบอัตโนมัติ',sl.id,'เปิดรับ','เต็ม','ระบบอัตโนมัติ: รอบ เต็ม');}
    return {ok:true,b};
  }finally{slotLock=false}
}

   <div><label class="lab">วันเริ่มงานได้</label><input class="in" id="ev-start" type="date" value="${c.start}"></div></div>
   <label class="lab">ความเห็นรวม (ภายใน)</label><textarea class="in" id="ev-cm" rows="2"></textarea>
   <label class="lab">ผลสัมภาษณ์</label><select class="in" id="ev-res" onchange="A.evres(this.value)"><option value="">— เลือก —</option><option value="passed">ผ่าน</option><option value="notpassed">ไม่ผ่าน</option><option value="reserve">สำรอง</option><option value="other">เหมาะกับตำแหน่งอื่น</option><option value="pending">รอพิจารณา</option></select>
   <div id="ev-fail" hidden><label class="lab">เหตุผลที่ไม่ผ่าน (เลือกได้หลายข้อ)</label><div class="tg">${FAIL.map(f=>`<label><input type="checkbox" value="${f}" class="ev-f"><span>${f}</span></label>`).join('')}</div></div>`,
   foot:`<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn p" onclick="${on(`A.saveResult(${J(bid)})`)}">บันทึกผล</button>`};render()};
A.sc=(k,n)=>{ui.ev.scores[k]=n;document.querySelectorAll(`#sc-${k} button`).forEach((b,i)=>b.classList.toggle('on',i<n))};
A.evres=v=>{const f=$('#ev-fail');if(f)f.hidden=!(v==='notpassed'||v==='other')};
A.saveResult=bid=>{const res=$('#ev-res').value;if(!res){toast('กรุณาเลือกผลสัมภาษณ์','bad');return}
  const reasons=[...document.querySelectorAll('.ev-f:checked')].map(x=>x.value);if(res==='notpassed'&&!reasons.length){toast('ไม่ผ่าน ต้องเลือกเหตุผลอย่างน้อย 1 ข้อ','bad');return}
  const b=S.bookings.find(x=>x.id===bid),c=candOf(b.cand),a=c.apps.find(x=>x.no===b.app);
  a.eval={scores:{...ui.ev.scores},shift:$('#ev-shift').value==='1',areaOk:$('#ev-area').value==='1',salary:+$('#ev-sal').value,start:$('#ev-start').value,comment:$('#ev-cm').value,by:USER(),at:now()};
  a.result=res==='other'?'notpassed':res;a.reasons=reasons;a.suitOther=res==='other';b.att='completed';b.eval=true;ui.modal=null;
  if(res==='passed'){setSt(c,a,'approval','ระบบอัตโนมัติ: ผ่านสัมภาษณ์ → อนุมัติการจ้าง');const s=siteOf(a.site);c.hire={wage:POS[a.pos].wage,allow:1200,shift:s.shift,start:a.eval.start,steps:[{r:'ฝ่ายบุคคล',st:'approved',by:USER(),at:now()},{r:'ผู้จัดการฝ่ายบุคคล',st:'pending'},{r:'ผู้จัดการฝ่าย',st:'waiting'}],st:'รอดำเนินการ'};notify(`รออนุมัติ: ${fullName(c)}`,'warn');act(`ผ่านสัมภาษณ์: ${fullName(c)} (${posN(a.pos)})`,'ok');c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:'ยินดีด้วย คุณผ่านการสัมภาษณ์ ทีมงานกำลังดำเนินการอนุมัติการจ้าง'})}
  else if(res==='notpassed'||res==='other'){setSt(c,a,'notpassed',reasons.join(', ')||'เหมาะกับตำแหน่งอื่น');act(`ไม่ผ่านสัมภาษณ์: ${fullName(c)} — ระบบเสนอให้ตรวจตำแหน่งอื่น`,'bad');c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:'ขอบคุณที่มาสัมภาษณ์ ทีมงานกำลังพิจารณาตำแหน่งอื่นที่อาจเหมาะกับคุณ'})}
  else if(res==='reserve'){setSt(c,a,'talent','สำรอง → คลังผู้สมัครสำรอง')}
  else setSt(c,a,'pendingres','รอพิจารณา');
  done('บันทึกผลสัมภาษณ์แล้ว');if(res==='notpassed'||res==='other')setTimeout(()=>A.rematch(c.id),250)};

/* blacklist review — ต้องให้คนตัดสิน */
A.blAct=(id,kind)=>{if(kind==='approve'&&!can('blacklistApprove')){toast('เฉพาะผู้จัดการฝ่ายบุคคล / ผู้ได้รับมอบอำนาจเท่านั้นที่อนุมัติบัญชีห้ามรับ ได้','bad');return}
  if(!guard('status')&&kind!=='approve')return;
  const t={approve:['อนุมัติบัญชีห้ามรับ','ผู้สมัครจะถูกบันทึกในบัญชีห้ามรับ และระบบจะแจ้งเตือนเมื่อสมัครใหม่ ประวัติเดิมจะไม่ถูกลบ'],override:['ยกเลิกการพิจารณา','ยกเลิกการพิจารณาบัญชีห้ามรับ และคงสถานะเดิมไว้'],chance:['ให้โอกาสอีกครั้ง','เปิดให้ผู้สมัครเลือกวันสัมภาษณ์ใหม่']}[kind];
  A.confirm(t[0],t[1],'doBl',[id,kind],{reason:true,codes:kind==='approve'?BLC:null,danger:kind==='approve',ok:t[0]})};
A.doBl=(id,kind,o)=>{const r=S.blr.find(x=>x.id===id),c=candOf(r.cand),a=cur(c);r.st=kind;r.by=USER();r.at2=now();r.reason=o.reason;
  if(kind==='approve'){c.blacklisted=true;setSt(c,a,'blacklisted',`${o.code}: ${o.reason}`);S.blacklist.unshift({id:'BL-'+String(S.blacklist.length+1).padStart(4,'0'),cand:c.id,name:fullName(c),cid:c.cid||c.passport,code:o.code,at:iso(new Date()),co:a.co,app:a.no,evidence:'บันทึก ไม่มาตามนัด 2 ครั้ง',by:USER(),review:d(365),type:'ชั่วคราว',remark:o.reason});act(`อนุมัติบัญชีห้ามรับ: ${fullName(c)}`,'bad')}
  else{setSt(c,a,'eligible',`${kind==='override'?'ยกเลิกการพิจารณา':'ให้โอกาสอีกครั้ง'}: ${o.reason}`);c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:'กรุณาเลือกวันสัมภาษณ์ใหม่ในเมนู "สัมภาษณ์"'})}
  log('พิจารณาบัญชีห้ามรับ',c.id,'รอดำเนินการ',kind,o.reason);done('บันทึกผลการพิจารณาแล้ว')};

/* re-matching */
A.rematch=cid=>{const c=candOf(cid),a=cur(c);const m=matchVac(c,a.pos).slice(0,5);
  ui.modal={title:`ตรวจตำแหน่งอื่น — ${fullName(c)}`,body:`<div class="alert info">คะแนนเป็นเพียงคำแนะนำฝ่ายบุคคล เป็นผู้ตัดสินใจเสนอตำแหน่ง</div>
   ${m.length?m.map(x=>`<div class="box" style="margin-bottom:8px"><div class="row"><b>${posN(x.v.pos)}</b><span class="muted sm">${esc(CO[x.v.co])} • ${esc(x.s.name)}</span><span class="sp"></span><span class="b ${x.sc>=70?'ok':x.sc>=50?'warn':'off'}">แนะนำ ${x.sc}</span></div>
   <div class="sm" style="margin:6px 0">${x.why.map(w=>`<span class="chip">✓ ${esc(w)}</span>`).join('')}${x.gap.map(w=>`<span class="chip" style="color:var(--attn)">! ${esc(w)}</span>`).join('')}</div>
   <div class="row sm muted">ว่าง ${x.v.qty} อัตรา • ${money(x.v.wage,POS[x.v.pos].unit)} • ${esc(x.s.shift)}<span class="sp"></span><button class="btn s p" onclick="${on(`A.offer(${J(c.id)},${J(x.v.id)})`)}">เสนอตำแหน่งนี้</button></div></div>`).join(''):'<div class="empty"><b>ยังไม่มีตำแหน่งที่เปิดรับซึ่งเหมาะสม</b>ย้ายเข้าคลังผู้สมัครสำรอง เพื่อเรียกภายหลัง</div>'}`,
   foot:`<button class="btn" onclick="${on(`A.toTalent(${J(c.id)})`)}">ย้ายเข้าคลังผู้สมัครสำรอง</button><button class="btn" onclick="A.close()">ปิด</button>`};render()};
A.offer=(cid,vid)=>{if(!guard('status'))return;const c=candOf(cid),v=vacOf(vid);c.offer={vac:vid,at:now(),st:'pending',by:USER()};tl(c,`ฝ่ายบุคคล เสนอตำแหน่ง ${posN(v.pos)} (${siteOf(v.site).name})`);log('เสนอตำแหน่งอื่น',c.id,'',v.id);c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:`บริษัทมีตำแหน่ง ${posN(v.pos)} ที่อาจเหมาะกับคุณ กรุณาตอบกลับในหน้าแรก`});act(`จับคู่ตำแหน่งใหม่: ${fullName(c)} → ${posN(v.pos)}`);ui.modal=null;done('ส่งข้อเสนอให้ผู้สมัครแล้ว')};
A.toTalent=cid=>{const c=candOf(cid);setSt(c,cur(c),'talent','ย้ายเข้าคลังผู้สมัครสำรอง');ui.modal=null;done('ย้ายเข้าคลังผู้สมัครสำรอง แล้ว')};
function acceptOffer(c,yes){const v=vacOf(c.offer.vac);c.offer.st=yes?'accepted':'declined';c.offer.resp=now();
  if(yes){const a={no:`${c.id}-${c.apps.length+1}`,pos:v.pos,co:v.co,site:v.site,vac:v.id,status:'eligible',created:now(),hist:[{from:'',to:'eligible',by:'ผู้สมัคร',at:now(),remark:'สร้างจากโปรไฟล์เดิม (ตอบรับข้อเสนอฝ่ายบุคคล)'}],result:null,reasons:[],eval:null};c.apps.push(a);
    reqDocs(c,v.pos).forEach(k=>{if(!c.docs[k])c.docs[k]={st:'none'}});
    tl(c,`สร้างใบสมัครใหม่ ${a.no} ตำแหน่ง${posN(v.pos)} จากโปรไฟล์เดิม`);act(`สร้างใบสมัครใหม่จากโปรไฟล์เดิม: ${fullName(c)} → ${posN(v.pos)}`);notify(`ผู้สมัครตอบรับตำแหน่งใหม่: ${fullName(c)} (${posN(v.pos)})`,'ok')}
  else{tl(c,'ผู้สมัครไม่สนใจตำแหน่งที่เสนอ');notify(`ผู้สมัครปฏิเสธข้อเสนอ: ${fullName(c)}`)}
  log('ตอบรับข้อเสนอ',c.id,'pending',c.offer.st);save()}

/* hiring approval */
A.apprStep=(cid,kind)=>{if(!guard('approve'))return;const c=candOf(cid);const st=c.hire.steps.find(s=>s.st==='pending');
  if(kind==='approve'){A.confirm('อนุมัติการจ้าง',`อนุมัติขั้น ${st.r} สำหรับ ${fullName(c)}`,'doAppr',[cid,'approve'],{ok:'อนุมัติ'})}
  else A.confirm(kind==='reject'?'ไม่อนุมัติการจ้าง':'ส่งกลับแก้ไข','ระบุเหตุผลเพื่อบันทึกในประวัติการอนุมัติ','doAppr',[cid,kind],{reason:true,danger:kind==='reject',ok:kind==='reject'?'ไม่อนุมัติ':'ส่งกลับ'})};
A.doAppr=(cid,kind,o)=>{const c=candOf(cid),a=cur(c);const i=c.hire.steps.findIndex(s=>s.st==='pending');const st=c.hire.steps[i];if(!st){toast('ไม่มีขั้นอนุมัติที่รอดำเนินการแล้ว','warn');return}
  st.st=kind==='approve'?'approved':kind==='reject'?'rejected':'returned';st.by=USER();st.at=now();st.remark=o.reason||'';log('อนุมัติการจ้าง',a.no,'รอดำเนินการ',st.st,`${st.r}: ${o.reason||''}`);
  if(kind==='approve'){if(c.hire.steps[i+1]){c.hire.steps[i+1].st='pending';done(`อนุมัติขั้น ${st.r} แล้ว — ส่งต่อ ${c.hire.steps[i+1].r}`)}
    else{c.hire.st='อนุมัติแล้ว';c.onb=c.onb||{};setSt(c,a,'onboarding','ระบบอัตโนมัติ: อนุมัติการจ้างแล้ว → เตรียมความพร้อมก่อนเริ่มงาน');c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:'การจ้างได้รับอนุมัติแล้ว กรุณากรอกแบบฟอร์มและลงนามเอกสารในเมนู "เอกสาร"'});act(`ผู้จัดการอนุมัติจ้าง: ${fullName(c)}`,'ok');done('อนุมัติครบ — เข้าสู่เตรียมความพร้อมก่อนเริ่มงาน')}}
  else if(kind==='reject'){c.hire.st='ไม่อนุมัติ';setSt(c,a,'closed','ไม่อนุมัติการจ้าง: '+o.reason);done('บันทึกไม่อนุมัติแล้ว','bad')}
  else{c.hire.st='ส่งกลับแก้ไข';st.st='pending';done('ส่งกลับแก้ไขแล้ว')}};
A.onbToggle=(cid,k)=>{if(!guard('edit'))return;const c=candOf(cid);c.onb=c.onb||{};c.onb[k]=!c.onb[k];log('รายการเตรียมความพร้อม',c.id,'',`${k}=${c.onb[k]}`);checkReady(c);done()};

/* documents */
A.docSet=(cid,k,st,o={})=>{if(!guard('docs'))return;const c=candOf(cid),doc=c.docs[k]||(c.docs[k]={st:'none'});const old=doc.st;doc.st=st;doc.by=USER().split(' (')[0];doc.vat=now();if(o.reason)doc.note=o.reason;
  log('ตรวจสอบเอกสาร',`${c.id}/${DOCS[k]}`,DST[old][0],DST[st][0],o.reason);tl(c,`เอกสาร ${DOCS[k]}: ${DST[st][0]}`);
  if(st==='correction'||st==='rejected'){c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:`${DOCS[k]}: ${o.reason||'กรุณาส่งใหม่'}`});notify(`เอกสารไม่ผ่าน: ${fullName(c)} — ${DOCS[k]}`,'warn')}
  if(st==='approved'&&docProg(c).missing.length===0){notify(`เอกสารครบ: ${fullName(c)}`,'ok')}
  checkReady(c);done(`${DOCS[k]}: ${DST[st][0]}`)};
A.docAsk=(cid,k,st)=>A.confirm(st==='rejected'?'ไม่อนุมัติเอกสาร':'ขอให้แก้ไขเอกสาร','ข้อความนี้จะแสดงให้ผู้สมัครเห็น ใช้ภาษาที่ชัดเจนและสุภาพ','docSet',[cid,k,st],{reason:true,ok:'ส่งให้ผู้สมัคร'});
A.docExp=(cid,k)=>{const v=$('#exp-'+k)?.value;if(!v)return;const c=candOf(cid);c.docs[k].exp=v;log('แก้วันหมดอายุเอกสาร',`${c.id}/${DOCS[k]}`,'',v);done('บันทึกวันหมดอายุแล้ว')};

/* communication */
A.addComm=cid=>{const c=candOf(cid);const ch=$('#cm-ch').value,res=$('#cm-res').value,note=$('#cm-note').value.trim();if(!note){toast('กรุณากรอกบันทึก','bad');return}c.comms.unshift({at:now(),by:USER(),ch,res,note});log('บันทึกการติดต่อ',c.id,'',`${ch}/${res}`);done('บันทึกการติดต่อแล้ว')};
A.addNote=cid=>{const c=candOf(cid);const t=$('#nt-int').value.trim();if(!t)return;c.notes.unshift({at:now(),by:USER(),text:t});log('บันทึกภายในฝ่ายบุคคล',c.id,'','เพิ่มบันทึกภายใน');done('บันทึกภายในแล้ว (ผู้สมัครไม่เห็น)')};
A.addMsg=cid=>{const c=candOf(cid);const t=$('#nt-pub').value.trim();if(!t)return;c.msgs.unshift({at:now(),by:'ฝ่ายบุคคล',text:t});log('ข้อความถึงผู้สมัคร',c.id,'',t);done('ส่งข้อความถึงผู้สมัครแล้ว')};

/* deployment */
A.deployForm=cid=>{if(!guard('edit'))return;const c=candOf(cid),a=cur(c);const miss=deployMissing(c);const sm=siteMatch(c);
  ui.modal={title:`ส่งลงหน่วยงาน — ${fullName(c)}`,body:(miss.length?`<div class="alert bad"><b>ไม่สามารถส่งลงหน่วยได้</b><ul style="margin:6px 0 0;padding-left:18px">${miss.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:`<div class="alert ok">ผ่านด่านตรวจก่อนส่งลงหน่วยงาน ครบทุกข้อ</div>`)+
   `<label class="lab">หน่วยงาน (เรียงตามคำแนะนำ)</label><select class="in" id="dp-site">${sm.map(x=>`<option value="${x.s.id}">${esc(x.s.name)} — ${esc(CO[x.s.co])} • ขาด ${x.gap} • แนะนำ ${x.sc}</option>`).join('')}</select>
   <div class="fg"><div><label class="lab">วันเริ่มงาน</label><input class="in" type="date" id="dp-start" value="${c.hire?.start||d(3)}"></div><div><label class="lab">กะ</label><input class="in" id="dp-shift" value="${esc(siteOf(sm[0]?.s.id).shift)}"></div>
   <div><label class="lab">เครื่องแบบ</label><input class="in" id="dp-uni" value="${POS[a.pos].g==='sec'?'ชุด รปภ. 2 ชุด':'ชุดปฏิบัติงาน 2 ชุด'}"></div><div><label class="lab">อุปกรณ์</label><input class="in" id="dp-eq" value="${POS[a.pos].g==='sec'?'วิทยุสื่อสาร, ไฟฉาย':'อุปกรณ์ทำความสะอาด'}"></div></div>`,
   foot:`<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn p" ${miss.length?'disabled':''} onclick="${on(`A.deploy(${J(cid)})`)}">สร้างรายการส่งลงหน่วย</button>`};render()};
A.deploy=cid=>{const c=candOf(cid),a=cur(c);if(deployMissing(c).length){toast('ไม่สามารถส่งลงหน่วยได้ — เงื่อนไข ยังไม่ครบ','bad');return}
  const site=$('#dp-site').value,s=siteOf(site);const dep={id:nextId('DEP'),cand:c.id,co:s.co,site,pos:a.pos,start:$('#dp-start').value,shift:$('#dp-shift').value,sup:s.sup,wage:c.hire.wage,allow:c.hire.allow,uniform:$('#dp-uni').value,equip:$('#dp-eq').value,st:'กำหนดแล้ว',at:now(),letter:'HR-FM-003'};

A.depSt=(id,st)=>{const dep=S.deploys.find(x=>x.id===id),c=candOf(dep.cand),a=cur(c);const old=dep.st;dep.st=st;log('สถานะการส่งลงหน่วยงาน',dep.id,old,st);

/* tasks (derived) */
function tasks(){
  const T=[];const hrs=S.settings.slaNewHrs;
  S.cands.forEach(c=>{const a=cur(c);if(!inScope(a.co))return;
    if(a.status==='new'){const due=new Date(new Date(a.created).getTime()+hrs*36e5);T.push({t:'ตรวจใบสมัครใหม่',c,a,owner:'คุณ'+c.rec,due,pri:'สูง',kind:'review'})}
    Object.entries(c.docs).forEach(([k,doc])=>{if(doc.st==='submitted'){const due=new Date(new Date(doc.up||a.created).getTime()+S.settings.slaDocDays*864e5);T.push({t:`ตรวจเอกสาร: ${DOCS[k]}`,c,a,owner:'เจ้าหน้าที่เอกสาร',due,pri:'กลาง',kind:'doc'})}});
    if(a.status==='approval'){const st=c.hire.steps.find(s=>s.st==='pending');T.push({t:`อนุมัติจ้าง (${st?.r})`,c,a,owner:st?.r,due:new Date(new Date(a.hist[0].at).getTime()+S.settings.slaApprDays*864e5),pri:'สูง',kind:'appr'})}
    if(a.status==='onboarding'){const n=onbItems(c).filter(i=>!i.done).length;T.push({t:`ติดตาม เตรียมเริ่มงาน (ค้าง ${n})`,c,a,owner:'เจ้าหน้าที่ฝึกอบรม',due:new Date(Date.now()+2*864e5),pri:'กลาง',kind:'onb'})}
    if(a.status==='ready')T.push({t:'พร้อมส่งลงหน่วย',c,a,owner:'ผู้ประสานงานหน่วยงาน',due:new Date(Date.now()+864e5),pri:'สูง',kind:'deploy'});
    if(a.status==='blacklist_review')T.push({t:'พิจารณา ไม่มาตามนัด / บัญชีห้ามรับ',c,a,owner:'ผู้จัดการฝ่ายบุคคล',due:new Date(Date.now()+864e5),pri:'สูง',kind:'bl'});
    if(a.status==='notpassed'&&(!c.offer||c.offer.st==='declined'))T.push({t:'ตรวจตำแหน่งอื่น (จับคู่ตำแหน่งใหม่)',c,a,owner:'คุณ'+c.rec,due:new Date(Date.now()+2*864e5),pri:'กลาง',kind:'rematch'});
    const bk=bookingOf(a);if(bk&&bk.att==='waiting'&&du(slotOf(bk.slot).date)===0)T.push({t:`โทรยืนยันก่อนสัมภาษณ์ ${slotOf(bk.slot).start}`,c,a,owner:'คุณ'+c.rec,due:new Date(TODAY.getTime()+8*36e5),pri:'กลาง',kind:'call'});
    Object.entries(c.docs).forEach(([k,doc])=>{const s=docSt(doc);if((s==='expiring'||s==='expired')&&(c.emp||ST[a.status].r>=5))T.push({t:`เอกสาร${s==='expired'?'หมดอายุ':'ใกล้หมดอายุ'}: ${DOCS[k]}`,c,a,owner:'เจ้าหน้าที่เอกสาร',due:pd(doc.exp),pri:s==='expired'?'สูง':'กลาง',kind:'exp'})});
  });
  T.forEach(t=>t.over=t.due<new Date());return T.sort((a,b)=>b.over-a.over||a.due-b.due);
}

function dt(key,cols,rows,o={}){
  const t=ui.tables[key]||(ui.tables[key]={q:'',sort:null,dir:1,page:0,hide:[]});
  let r=rows;
  if(t.q){const q=t.q.toLowerCase();r=r.filter(x=>cols.map(c=>String(c.v(x)??'')).join(' ').toLowerCase().includes(q))}
  if(t.sort!=null&&cols[t.sort]){const c=cols[t.sort];r=[...r].sort((a,b)=>{const x=c.v(a),y=c.v(b);return (x>y?1:x<y?-1:0)*t.dir})}
  DTC[key]={cols,rows:r};
  const per=o.per||10,pages=Math.max(1,Math.ceil(r.length/per));if(t.page>=pages)t.page=pages-1;if(t.page<0)t.page=0;
  const pr=r.slice(t.page*per,t.page*per+per);const vis=cols.map((c,i)=>i).filter(i=>!t.hide.includes(i));
  return `<div class="dtbar"><input class="in" id="dtq-${key}" placeholder="ค้นหาในตาราง" aria-label="ค้นหาในตาราง" value="${esc(t.q)}" oninput="${on(`A.dtq(${J(key)},this.value)`)}">${o.filters||''}<span class="sp"></span>
   <details class="cv" ${ui.cv===key?'open':''} ontoggle="${on(`A.cvt(${J(key)},this.open)`)}"><summary class="btn s">คอลัมน์</summary><div class="menu">${cols.map((c,i)=>`<label><input type="checkbox" ${t.hide.includes(i)?'':'checked'} onchange="${on(`A.dtcol(${J(key)},${i})`)}"> ${esc(c.t)}</label>`).join('')}</div></details>
   <button class="btn s" onclick="${on(`A.dtexp(${J(key)})`)}">ส่งออก</button></div>
   ${r.length?`<div class="tw"><table class="t"><thead><tr>${vis.map(i=>`<th onclick="${on(`A.dts(${J(key)},${i})`)}">${esc(cols[i].t)}${t.sort===i?(t.dir>0?' ↑':' ↓'):''}</th>`).join('')}${o.act?'<th></th>':''}</tr></thead><tbody>
   ${pr.map(x=>`<tr ${o.open?`class="cl" onclick="${on(o.open(x))}"`:''}>${vis.map(i=>`<td>${cols[i].h?cols[i].h(x):esc(cols[i].v(x))}</td>`).join('')}${o.act?`<td onclick="event.stopPropagation()" style="white-space:nowrap;text-align:right">${o.act(x)}</td>`:''}</tr>`).join('')}</tbody></table></div>
   <div class="pg">แสดง ${t.page*per+1}–${Math.min(r.length,(t.page+1)*per)} จาก ${r.length}<button class="btn s" ${t.page===0?'disabled':''} onclick="${on(`A.dtp(${J(key)},-1)`)}">ก่อนหน้า</button><button class="btn s" ${t.page>=pages-1?'disabled':''} onclick="${on(`A.dtp(${J(key)},1)`)}">ถัดไป</button></div>`
   :(o.empty||empty(t.q?'ไม่พบข้อมูลที่ค้นหา':'ยังไม่มีข้อมูล',t.q?'ลองคำค้นอื่น หรือล้างตัวกรอง':''))}`;
}

/* ---------- filters ---------- */
function filt(){const g=ui.gf;
  const pairs=[];S.cands.forEach(c=>c.apps.forEach(a=>pairs.push({c,a})));
  const ok=p=>{const s=siteOf(p.a.site);return inScope(p.a.co)&&(!g.company||p.a.co===g.company)&&(!g.area||s.area===g.area)&&(!g.pos||p.a.pos===g.pos)&&(!g.rec||p.c.rec===g.rec)};
  const inR=t=>{const n=-du(dayOf(t));return g.range==='today'?n===0:g.range==='week'?n<7:g.range==='month'?n<31:true};
  const sites=S.sites.filter(s=>inScope(s.co)&&(!g.company||s.co===g.company)&&(!g.area||s.area===g.area));
  return {pairs:pairs.filter(ok),inR,sites}}
function gfBar(){const g=ui.gf;const sel=(k,opts,lab)=>`<select class="in" aria-label="${lab}" onchange="${on(`A.gf(${J(k)},this.value)`)}">${opts.map(([v,t])=>`<option value="${v}" ${g[k]===v?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  return `<div class="filters"><span class="sm muted">ตัวกรอง</span>${sel('range',[['today','วันนี้'],['week','7 วัน'],['month','30 วัน'],['all','ทั้งหมด']],'ช่วงเวลา')}${sel('company',[['','ทุกบริษัท'],...Object.entries(CO).filter(([k])=>inScope(k))],'บริษัท')}${sel('area',[['','ทุกพื้นที่'],...AREAS.map(a=>[a,a])],'พื้นที่')}${sel('pos',[['','ทุกตำแหน่ง'],...Object.keys(POS).map(p=>[p,posN(p)])],'ตำแหน่ง')}${sel('rec',[['','ทุกเจ้าหน้าที่สรรหา'],['เมย์','คุณเมย์'],['แนน','คุณแนน'],['บอส','คุณบอส']],'เจ้าหน้าที่สรรหา')}</div>`}
function gapRows(sites){const out=[];sites.forEach(s=>Object.keys(s.req).forEach(p=>{if(ui.gf.pos&&p!==ui.gf.pos)return;const req=s.req[p],c=s.cur[p]||0;const gap=Math.max(0,req-c);
  const inP=S.cands.filter(x=>{const a=cur(x);return a.site===s.id&&a.pos===p});out.push({s,p,req,cur:c,gap,lv:gapLv(gap,req),rec:inP.filter(x=>{const r=ST[cur(x).status].r;return r>=0&&r<=5&&!['notpassed','talent','blacklisted','blacklist_review'].includes(cur(x).status)}).length,ready:inP.filter(x=>cur(x).status==='ready').length,started:inP.filter(x=>x.emp&&-du(x.emp.start)<31).length})}));return out}

/* ---------- executive dashboard ---------- */
function vExec(){
  const f=filt(),P=f.pairs,G=gapRows(f.sites);
  const totalGap=G.reduce((a,x)=>a+x.gap,0),siteGap=new Set(G.filter(x=>x.gap>0).map(x=>x.s.id)).size;
  const bT=S.bookings.filter(b=>du(slotOf(b.slot).date)===0&&!['resched','cancel_app','cancel_hr'].includes(b.att)&&P.some(p=>p.a.no===b.app));
  const ready=P.filter(p=>p.a.status==='ready').length,crit=G.filter(x=>x.lv==='bad');
  const inM=P.filter(p=>f.inR(p.a.created));
  const pendDocs=P.reduce((n,p)=>n+Object.values(p.c.docs).filter(x=>x.st==='submitted').length,0);
  const expired=P.reduce((n,p)=>n+Object.values(p.c.docs).filter(x=>docSt(x)==='expired').length,0);
  const passed=P.filter(p=>p.a.result==='passed'&&f.inR(p.a.eval?.at||p.a.created)).length,failed=P.filter(p=>p.a.result==='notpassed'&&f.inR(p.a.eval?.at||p.a.created)).length;
  const ns=S.bookings.filter(b=>b.att==='noshow'&&P.some(p=>p.a.no===b.app)&&f.inR(slotOf(b.slot).date+'T12:00:00')).length;
  const started=P.filter(p=>p.c.emp&&p.a.status==='employee'&&f.inR(p.c.emp.start+'T12:00:00')).length;

  const perSite={};G.forEach(x=>{const k=x.s.id;perSite[k]=perSite[k]||{s:x.s,req:0,cur:0};perSite[k].req+=x.req;perSite[k].cur+=x.cur});
  const hero=`<section class="hero"><div><h1>${totalGap?`ยังขาดคน ${totalGap} อัตรา ใน ${siteGap} จาก ${f.sites.length} หน่วยงาน`:'ทุกหน่วยงานมีกำลังคนครบ'}</h1>
    <div class="hs">${crit.length?`จุดวิกฤต: ${crit.slice(0,3).map(x=>`${x.s.name} (${posN(x.p)} ขาด ${x.gap})`).join(', ')}`:'ไม่มีหน่วยงานที่อยู่ในระดับวิกฤต'}</div>
    <div class="hstats"><div><b>${ready}</b><span>พร้อมลงงาน</span></div><div><b>${bT.length}</b><span>นัดสัมภาษณ์วันนี้</span></div><div><b>${crit.length}</b><span>ตำแหน่งวิกฤต</span></div><div><b>${appr}</b><span>รออนุมัติจ้าง</span></div></div></div>
    <div class="strip" aria-label="กำลังคนรายหน่วยงาน">${Object.values(perSite).sort((a,b)=>(a.cur/a.req)-(b.cur/b.req)).map(x=>{const lv=gapLv(x.req-x.cur,x.req);return `<div class="srow" onclick="A.go('mpdash')" title="${esc(x.s.name)}"><span>${esc(x.s.name)}</span><div class="sbar"><i class="lv-${lv}" style="width:${Math.round(x.cur/x.req*100)}%"></i></div><span class="num">${x.cur}/${x.req}</span></div>`}).join('')}</div></section>`;
  const k=`<div class="kpis">${kpi('ผู้สมัครวันนี้',P.filter(p=>du(dayOf(p.a.created))===0).length,'','info','apps')}${kpi('ผู้สมัครในช่วงที่เลือก',inM.length,'','info','apps')}${kpi('เอกสารรอตรวจ',pendDocs,'','warn','verify')}${kpi('สัมภาษณ์วันนี้',bT.length,`มาแล้ว ${bT.filter(b=>['arrived','late','completed'].includes(b.att)).length}`,'info','today')}
   ${kpi('ผ่านสัมภาษณ์',passed,'','ok','results')}${kpi('ไม่ผ่านสัมภาษณ์',failed,'','bad','rematch')}${kpi('พร้อมลงงาน',ready,'','ok','pool')}${kpi('เริ่มงาน',started,'','ok','emp')}
   ${kpi('ไม่มาตามนัด',ns,'','bad','noshow')}${kpi('ช่องว่างวิกฤต',crit.reduce((a,x)=>a+x.gap,0),`${crit.length} ตำแหน่ง`,crit.length?'bad':'ok','mpdash')}${kpi('เอกสารหมดอายุ',expired,'','bad','expiry')}${kpi('รออนุมัติ',appr+S.mpr.filter(m=>['ส่งคำขอแล้ว','รออนุมัติ'].includes(m.st)).length,'จ้าง + อัตรากำลัง','warn','approvals')}</div>`;
  return ph('แดชบอร์ดผู้บริหาร','ภาพรวมกำลังคน การสรรหา และความเสี่ยง — ข้อมูลตามตัวกรอง')+gfBar()+hero+k+
   `<div class="g2">${card('ขั้นตอนการสรรหา',funnel(P))}${card('อัตรากำลังที่ขาด',gapTable(G.filter(x=>x.gap>0).sort((a,b)=>b.gap/b.req-a.gap/a.req).slice(0,6),true),`<button class="btn s" onclick="A.go('mpdash')">ดูทั้งหมด</button>`)}</div>
   <div class="g2">${card('ผลการสัมภาษณ์',intPerf(P))}${card('กลุ่มพร้อมลงงาน',readyList(P))}</div>
   <div class="g2">${card('หน่วยงานวิกฤต',critList(G))}${card('แจ้งเตือนเอกสาร',docAlerts(P))}</div>
   <div class="g2">${card('ผลงานเจ้าหน้าที่สรรหา',recPerf(P))}${card('ประสิทธิภาพช่องทางรับสมัคร',srcPerf(P))}</div>
   <div class="g2">${card('งานที่ต้องทำ',taskList(8),`<button class="btn s" onclick="A.go('tasks')">ทั้งหมด</button>`)}${card('ความเคลื่อนไหวล่าสุด',activity(8))}</div>`;
}
function funnel(P){const st=[['สมัคร',0],['ผ่านตรวจใบสมัคร',2],['นัดสัมภาษณ์',3],['เข้าสัมภาษณ์',4],['ผ่านสัมภาษณ์',5],['พร้อมลงงาน',6],['เริ่มงาน',7]];const n=st.map(([t,r])=>[t,P.filter(p=>{const a=p.a;if(r===5)return ST[a.status].r>=5||a.result==='passed';if(r===4)return ST[a.status].r>=4&&a.status!=='blacklist_review';return ST[a.status].r>=r}).length]);const mx=Math.max(1,n[0][1]);
  return `<div class="fun">${n.map(([t,v],i)=>`<div class="frow"><span>${t}</span><div class="fbar"><i style="width:${Math.max(2,v/mx*100)}%;opacity:${.95-i*.09}"></i></div><span class="num">${v}</span></div>`).join('')}</div><p class="sm muted" style="margin-bottom:0">อัตราผ่านจากสมัครถึงเริ่มงาน ${Math.round(n[6][1]/mx*100)}%</p>`}
function gapTable(G,compact){if(!G.length)return empty('ไม่มีตำแหน่งที่ขาดคน','');return `<div class="tw"><table class="t"><thead><tr><th>หน่วยงาน</th><th>ตำแหน่ง</th><th>ต้องการ</th><th>มีอยู่</th><th>ขาด</th>${compact?'':'<th>กำลังสรรหา</th><th>พร้อม</th><th>เริ่มงาน</th>'}<th>ระดับ</th></tr></thead><tbody>${G.map(x=>`<tr><td>${esc(x.s.name)}<div class="sm muted">${CO[x.s.co]}</div></td><td>${posN(x.p)}</td><td class="num">${x.req}</td><td class="num">${x.cur}</td><td class="num"><b>${x.gap}</b></td>${compact?'':`<td class="num">${x.rec}</td><td class="num">${x.ready}</td><td class="num">${x.started}</td>`}<td>${badge(x.lv,LVT[x.lv])}</td></tr>`).join('')}</tbody></table></div>`}
function intPerf(P){const B=S.bookings.filter(b=>P.some(p=>p.a.no===b.app));const past=B.filter(b=>du(slotOf(b.slot).date)<=0&&!['resched','cancel_app','cancel_hr'].includes(b.att));const att=past.filter(b=>['arrived','late','completed'].includes(b.att)).length;const ns=past.filter(b=>b.att==='noshow').length;const done=B.filter(b=>b.eval);const pass=done.filter(b=>P.find(p=>p.a.no===b.app)?.a.result==='passed').length;
  const r=(a,b)=>b?Math.round(a/b*100)+'%':'–';
  return `<dl class="kv"><dt>นัดที่ถึงกำหนดแล้ว</dt><dd class="num">${past.length}</dd><dt>การจอง → มาสัมภาษณ์</dt><dd class="num">${r(att,past.length)}</dd><dt>มาสัมภาษณ์ → ผ่าน</dt><dd class="num">${r(pass,done.length)}</dd><dt>อัตราไม่มาตามนัด</dt><dd class="num">${r(ns,past.length)}</dd></dl><p class="sm muted" style="margin-bottom:0">ดูรายละเอียดรายเจ้าหน้าที่สรรหา/ตำแหน่งที่ แดชบอร์ดการสัมภาษณ์</p>`}
function readyList(P){const R=P.filter(p=>p.a.status==='ready');if(!R.length)return empty('ยังไม่มีผู้พร้อมลงงาน','ผู้ที่ผ่าน เตรียมเริ่มงาน ครบจะแสดงที่นี่');return R.map(({c,a})=>`<div class="li">${av(c)}<div style="flex:1"><b style="font-weight:500">${esc(fullName(c))}</b><div class="sm muted">${posN(a.pos)} • ${esc(c.area)}</div></div><button class="btn s p" onclick="${on(`A.deployForm(${J(c.id)})`)}">ส่งลงหน่วย</button></div>`).join('')}
function critList(G){const C=G.filter(x=>x.lv==='bad'||x.lv==='attn').sort((a,b)=>b.gap/b.req-a.gap/a.req);if(!C.length)return empty('ไม่มี หน่วยงาน วิกฤต','');return C.map(x=>`<div class="li"><div style="flex:1"><b style="font-weight:500">${esc(x.s.name)}</b><div class="sm muted">${posN(x.p)} • ${x.cur}/${x.req} • กำลังสรรหา ${x.rec} • พร้อม ${x.ready}</div></div>${badge(x.lv,`ขาด ${x.gap}`)}</div>`).join('')}
function docAlerts(P){const L=[];P.forEach(({c})=>Object.entries(c.docs).forEach(([k,doc])=>{const s=docSt(doc);if(['expired','expiring','correction'].includes(s))L.push({c,k,doc,s})}));const u=[...new Map(L.map(x=>[x.c.id+x.k,x])).values()];if(!u.length)return empty('ไม่มีเอกสารที่ต้องจัดการ','');

function recPerf(P){return `<div class="tw"><table class="t"><thead><tr><th>เจ้าหน้าที่สรรหา</th><th>ผู้สมัคร</th><th>สัมภาษณ์</th><th>ผ่าน</th><th>ไม่มาตามนัด</th><th>เริ่มงาน</th><th>เป้าจ้าง</th></tr></thead><tbody>${Object.entries(S.targets).map(([r,t])=>{const X=P.filter(p=>p.c.rec===r);const iv=X.filter(p=>ST[p.a.status].r>=3).length;const pass=X.filter(p=>p.a.result==='passed').length;const ns=S.bookings.filter(b=>b.att==='noshow'&&X.some(p=>p.a.no===b.app)).length;const st=X.filter(p=>p.a.status==='employee').length;
  return `<tr><td>คุณ${r}</td><td class="num">${X.length}</td><td class="num">${iv}</td><td class="num">${pass}</td><td class="num">${ns}</td><td class="num">${st}</td><td><div class="row" style="flex-wrap:nowrap"><div class="pbar" style="flex:1"><i style="width:${Math.min(100,pass/t.hire*100)}%"></i></div><span class="sm num">${pass}/${t.hire}</span></div></td></tr>`}).join('')}</tbody></table></div>`}
function srcPerf(P){const rows=SOURCES.map(s=>{const X=P.filter(p=>p.c.source===s);return {s,n:X.length,iv:X.filter(p=>ST[p.a.status].r>=3).length,pass:X.filter(p=>p.a.result==='passed').length,st:X.filter(p=>p.a.status==='employee').length,cost:S.srcCost[s]||0}}).filter(r=>r.n);

function taskList(n){const T=tasks().slice(0,n);if(!T.length)return empty('ไม่มีงานค้าง','');return T.map(t=>`<div class="li" style="cursor:pointer" onclick="${on(`A.open(${J(t.c.id)})`)}"><div style="flex:1"><b style="font-weight:500">${esc(t.t)}</b><div class="sm muted">${esc(fullName(t.c))} • ${esc(t.owner||'')} • ครบกำหนด ${fDT(t.due.toISOString())}</div></div>${t.over?badge('bad','เกินกำหนด'):badge(t.pri==='สูง'?'attn':'off',t.pri)}</div>`).join('')}
function activity(n){return S.activity.slice(0,n).map(x=>`<div class="li"><span class="b ${x.kind}" style="width:10px;height:10px;padding:0"></span><div style="flex:1"><div>${esc(x.text)}</div><div class="sm muted">${fDT(x.at)}</div></div></div>`).join('')||empty('ยังไม่มีกิจกรรม','')}

    {t:'ขั้นอนุมัติ',v:c=>c.hire.st,h:c=>c.hire.steps.map(s=>badge({approved:'ok',pending:'warn',waiting:'off',rejected:'bad',returned:'attn'}[s.st],s.r)).join(' ')}],P,
   {open:c=>`A.open(${J(c.id)},'approval')`,act:c=>c.hire.steps.some(s=>s.st==='pending')&&cur(c).status==='approval'?`<button class="btn s ok" onclick="${on(`A.apprStep(${J(c.id)},'approve')`)}">อนุมัติ</button> <button class="btn s" onclick="${on(`A.apprStep(${J(c.id)},'return')`)}">ส่งกลับ</button> <button class="btn s d" onclick="${on(`A.apprStep(${J(c.id)},'reject')`)}">ไม่อนุมัติ</button>`:'',empty:empty('ไม่มีคำขออนุมัติจ้าง','')}))}

function onbPanel(c){const I=onbItems(c);const n=I.filter(i=>i.done).length;return `<div class="row" style="margin-bottom:8px"><div class="pbar" style="flex:1"><i style="width:${n/I.length*100}%"></i></div><span class="sm num">${n}/${I.length}</span></div>${I.map(i=>`<div class="li" style="padding:6px 0"><input type="checkbox" ${i.done?'checked':''} ${i.auto?'disabled':''} aria-label="${esc(i.t)}" onchange="${on(`A.onbToggle(${J(c.id)},${J(i.k)})`)}"><span style="flex:1">${esc(i.t)}</span>${i.auto?`<span class="sm muted">${i.code?'จาก ลงนามอิเล็กทรอนิกส์ ผู้สมัคร':'จากเอกสาร'}</span>`:''}</div>`).join('')}`}

   {act:c=>`<button class="btn s" onclick="${on(`A.matchGo(${J(c.id)})`)}">จับคู่หน่วยงาน</button> <button class="btn s p" onclick="${on(`A.deployForm(${J(c.id)})`)}">ส่งลงหน่วย</button>`,open:c=>`A.open(${J(c.id)})`,empty:empty('ยังไม่มีผู้พร้อมลงงาน','')}))}

   card('หน่วยงาน ที่แนะนำ',siteMatch(c).map(x=>`<div class="li"><div style="flex:1"><b style="font-weight:500">${esc(x.s.name)}</b> <span class="sm muted">${CO[x.s.co]} • ${esc(x.s.area)} • ${esc(x.s.shift)}</span><div class="sm">${x.why.map(w=>`<span class="chip">✓ ${esc(w)}</span>`).join('')}${x.note?`<span class="chip" style="color:var(--attn)">เงื่อนไขหน่วยงาน: ${esc(x.note)}</span>`:''}</div></div>${badge(x.sc>=70?'ok':x.sc>=45?'warn':'off','แนะนำ '+x.sc)}</div>`).join('')+`<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p" onclick="${on(`A.deployForm(${J(c.id)})`)}">ส่งลงหน่วย</button></div>`):card('จับคู่หน่วยงาน',empty('ยังไม่มีผู้พร้อมลงงาน','')))}
function vDeploy(hist){const L=S.deploys.filter(x=>inScope(x.co)&&(hist?['เริ่มงานแล้ว','โอนย้ายแล้ว','ยกเลิก','ไม่มาตามนัด'].includes(x.st):true));const K={'กำหนดแล้ว':'info','รายงานตัวแล้ว':'warn','เริ่มงานแล้ว':'ok','ไม่มาตามนัด':'bad','ยกเลิก':'off','โอนย้ายแล้ว':'info'};

   {act:x=>x.st==='กำหนดแล้ว'?`<button class="btn s" onclick="${on(`A.depSt(${J(x.id)},'รายงานตัวแล้ว')`)}">รายงานตัว</button> <button class="btn s ok" onclick="${on(`A.depSt(${J(x.id)},'เริ่มงานแล้ว')`)}">เริ่มงาน</button> <button class="btn s d" onclick="${on(`A.depSt(${J(x.id)},'ไม่มาตามนัด')`)}">ไม่มา</button>`:x.st==='รายงานตัวแล้ว'?`<button class="btn s ok" onclick="${on(`A.depSt(${J(x.id)},'เริ่มงานแล้ว')`)}">เริ่มงาน</button>`:'',open:x=>`A.open(${J(x.cand)},'deploy')`,empty:empty('ยังไม่มีรายการ','',`<button class="btn p" onclick="A.go('pool')">ไปที่ กลุ่มพร้อมลงงาน</button>`)}))}

function vForeign(){const F=S.cands.filter(isForeign);return ph('แรงงานต่างด้าว','หนังสือเดินทาง • วีซ่า • ใบอนุญาตทำงาน • บัตรชมพู • MOU — แจ้งเตือนวันหมดอายุ')+card('แรงงานต่างด้าว',dt('fw',[{t:'ชื่อ',v:c=>fullName(c)+' / '+c.en,h:c=>nameCell(c)+`<div class="sm muted">${esc(c.en)}</div>`},{t:'สัญชาติ',v:c=>c.nat},{t:'หนังสือเดินทาง',v:c=>maskId(c.passport)},...['passport','visa','wp','pink'].map(k=>({t:DOCS[k],v:c=>c.docs[k]?.exp||'',h:c=>c.docs[k]?docB(c.docs[k])+(c.docs[k].exp?`<div class="sm muted">${fD(c.docs[k].exp)}</div>`:''):'–'})),{t:'นายจ้าง / งาน',v:c=>CO[cur(c).co]+' / '+posN(cur(c).pos)},{t:'สถานที่ทำงาน',v:c=>siteOf(cur(c).site).name},{t:'สถานะ',v:c=>ST[cur(c).status].t,h:c=>stB(cur(c).status)}],F,{open:c=>`A.open(${J(c.id)},'docs')`}))}

function vTasks(){const T=tasks();return ph('งานของฉัน',`กำหนดเวลา: ใบสมัครใหม่ ${S.settings.slaNewHrs} ชม. • เอกสาร ${S.settings.slaDocDays} วัน • อนุมัติ ${S.settings.slaApprDays} วัน`)+`<div class="kpis" style="margin-bottom:16px">${kpi('งานทั้งหมด',T.length,'','info','tasks')}${kpi('เกินกำหนด',T.filter(t=>t.over).length,'','bad','tasks')}${kpi('ความสำคัญสูง',T.filter(t=>t.pri==='สูง').length,'','attn','tasks')}</div>`+card('ศูนย์งาน',dt('tasks',[{t:'งาน',v:t=>t.t},{t:'ผู้เกี่ยวข้อง',v:t=>fullName(t.c)},{t:'หน่วยงาน',v:t=>siteOf(t.a.site).name},{t:'ผู้รับผิดชอบ',v:t=>t.owner},{t:'ครบกำหนด',v:t=>t.due.getTime(),h:t=>fDT(t.due.toISOString())},{t:'ความสำคัญ',v:t=>t.pri,h:t=>badge(t.pri==='สูง'?'attn':'off',t.pri)},{t:'สถานะ',v:t=>t.over?'เกินกำหนด':'เปิดรับ',h:t=>t.over?badge('bad','เกินกำหนด'):badge('info','เปิดรับ')}],T,{open:t=>`A.open(${J(t.c.id)})`,per:15,empty:empty('ไม่มีงานค้าง','')}))}
function vApprovals(){const H=S.cands.filter(c=>cur(c).status==='approval'&&inScope(cur(c).co));const M=S.mpr.filter(m=>['ส่งคำขอแล้ว','รออนุมัติ'].includes(m.st)&&inScope(m.co));

function vNotif(){return ph('การแจ้งเตือน','ช่องทาง: ในแอป • LINE • อีเมล • SMS (อนาคต)',`<button class="btn" onclick="A.readAll()">อ่านทั้งหมด</button>`)+card('การแจ้งเตือน',S.notifs.map(n=>`<div class="li"><span class="b ${n.kind}" style="width:10px;height:10px;padding:0"></span><div style="flex:1;${n.read?'color:var(--muted)':''}">${esc(n.text)}<div class="sm muted">${fDT(n.at)}</div></div>${n.read?'':badge('info','ใหม่')}</div>`).join('')||empty('ไม่มีการแจ้งเตือน',''))}

/* ---------- reports ---------- */
const REP={applicant:'รายงานผู้สมัคร',interview:'รายงานการสัมภาษณ์',manpower:'รายงานอัตรากำลัง',document:'รายงานเอกสาร',deployment:'รายงานการส่งลงหน่วยงาน',recruiter:'รายงานเจ้าหน้าที่สรรหา',source:'รายงานช่องทางรับสมัคร',blacklist:'รายงานบัญชีห้ามรับ',noshow:'รายงานไม่มาตามนัด'};
function vReport(k){const P=S.cands.map(c=>({c,a:cur(c)}));let body;
  if(k==='applicant')body=dt('r-app',[{t:'เลขที่ผู้สมัคร',v:r=>r.c.id},{t:'ชื่อ',v:r=>fullName(r.c)},{t:'ตำแหน่ง',v:r=>posN(r.a.pos)},{t:'บริษัท',v:r=>CO[r.a.co]},{t:'หน่วยงาน',v:r=>siteOf(r.a.site).name},{t:'ช่องทาง',v:r=>r.c.source},{t:'เจ้าหน้าที่สรรหา',v:r=>r.c.rec},{t:'สัญชาติ',v:r=>r.c.nat},{t:'สถานะ',v:r=>ST[r.a.status].t},{t:'สมัคร',v:r=>dayOf(r.a.created)}],P);
  else if(k==='interview')body=dt('r-int',[{t:'การจอง',v:b=>b.id},{t:'ผู้สมัคร',v:b=>fullName(candOf(b.cand))},{t:'วันที่',v:b=>slotOf(b.slot).date},{t:'เวลา',v:b=>slotOf(b.slot).start},{t:'การมาสัมภาษณ์',v:b=>ATT[b.att][0]},{t:'ผล',v:b=>{const r=candOf(b.cand).apps.find(a=>a.no===b.app).result||'';return RESL[r]||r}},{t:'เลื่อน (ครั้ง)',v:b=>b.resched}],S.bookings);
  else if(k==='manpower')body=gapTable(gapRows(S.sites.filter(s=>inScope(s.co))),false);
  else if(k==='document')body=dt('r-doc',[{t:'ชื่อ',v:r=>fullName(r.c)},{t:'ตำแหน่ง',v:r=>posN(r.a.pos)},{t:'ครบ (%)',v:r=>docProg(r.c,r.a.pos).pct},{t:'ที่ขาด',v:r=>docProg(r.c,r.a.pos).missing.map(x=>DOCS[x]).join(', ')}],P);
  else if(k==='deployment')return vDeploy(true);
  else if(k==='recruiter')body=recPerf(P);
  else if(k==='source')body=srcPerf(P);
  else if(k==='blacklist')return vBL();
  else if(k==='noshow')return vNoShow();
  return ph(REP[k],'ส่งออกได้เป็น CSV (Excel/PDF เมื่อเชื่อมระบบหลังบ้าน) • พิมพ์เป็น PDF ได้จากเบราว์เซอร์')+card(REP[k],body)}

function vSoon(r){return ph(TITLES[r]||r,'')+card(TITLES[r]||r,empty('หน้านี้อยู่ในแผนเฟสถัดไป','โครงสร้างข้อมูลรองรับแล้ว — ดู พิมพ์เขียวระบบ',`<button class="btn" onclick="A.go('blueprint')">เปิด พิมพ์เขียวระบบ</button>`))}
function vBlueprint(){const T=[['users','id, name, email, phone, role_id→roles, company_scope[], 2fa_enabled, last_login'],['roles / permissions','role ↔ permission (many-to-many) + company scope'],['companies → branches → sites','sites: client_id→clients, area, province, shift_ids, requirement_json'],['positions','code, name, group, default_wage, unit, checklist_id→document_checklists'],['manpower_requests','id MPR-, site_id, position_id, required, current, qty, reason_code, status, approved_by'],['vacancies','id VAC-, manpower_request_id, site_id, position_id, qty, wage, recruiter_id, open/close, status, public_slug'],['candidates','id APP-, citizen_id UNIQUE, passport UNIQUE, phone UNIQUE, dob, nationality, … , employee_id→employees NULL'],['applications','id, candidate_id, vacancy_id, position_id, site_id, status, result, fail_reason_codes[], parent_application_id'],['candidate_addresses / education / experience / skills','1:N กับ candidates'],['candidate_documents','candidate_id, document_type_id, file_key, number, issue/expiry, status, verified_by, applicant_visible_note'],['interview_slots','id, date, start, end, capacity, booked_count, company/position/site, interviewer_id, status, version (optimistic lock)'],['interview_bookings','id INT-, slot_id, application_id, status, reschedule_count, UNIQUE(slot_id, application_id)'],['interview_attendance / results / evaluations','booking_id FK, check_in_at, scores_json, result, reasons[], internal_comment'],['blacklist / blacklist_reviews','candidate_id, id_number, reason_code, evidence_key, approved_by, type, review_date'],['talent_pool / candidate_matches','candidate_id, vacancy_id, score (recommendation only), reasons_json'],['communications','candidate_id, user_id, channel, result, note'],['approvals','entity_type, entity_id, step_no, approver_role, status, remark'],['onboarding / online_forms','application_id, item_key, done_by, done_at'],['document_templates / generated_documents / signatures','template code+revision, generated file, signer, signed_at, ip, device, version'],['ready_pool / deployments','id DEP-, application_id, site_id, start, shift, supervisor, status'],['employees / employee_documents / transfers','id EMP-, candidate_id UNIQUE, current_site_id, …'],['tasks / notifications','owner_id, due_at, priority, sla_rule, related_candidate_id, related_site_id'],['activity_logs / audit_logs','actor, action, entity, old_value_json, new_value_json, ip, device, at (append-only)'],['status_history','entity, from_status, to_status, user_id, at, remark (ห้ามเขียนทับ)'],['settings / reason_codes','key-value, versioned']];
  const API=['POST /auth/applicant/phone (ล็อกอินผู้สมัครด้วยเบอร์โทร + จำกัดจำนวนครั้ง/ชั่วโมง) • POST /auth/login (ฝ่ายบุคคล: อีเมล + รหัสผ่าน)','GET/POST /candidates • GET /candidates/{id} • POST /candidates/duplicate-check','POST /applications • PATCH /applications/{id}/status (บันทึก status_history)','POST /candidates/{id}/documents (upload, virus scan) • PATCH /documents/{id}/verify','GET/POST /interview-slots • PATCH /interview-slots/{id}','POST /interview-slots/{id}/bookings — SELECT … FOR UPDATE, ตรวจ capacity ใน transaction','POST /bookings/{id}/reschedule • /check-in • /no-show','POST /bookings/{id}/evaluation • POST /applications/{id}/rematch (recommendation)','GET/POST /manpower-requests • POST /vacancies • GET /public/jobs/{slug}','POST /approvals/{id}/decision • GET /onboarding/{appId} • POST /signatures','POST /deployments (deployment gate ฝั่งเซิร์ฟเวอร์) • PATCH /deployments/{id}/status → สร้าง employee','GET /employees • POST /transfers','GET /dashboard/{executive|hr|recruiter|manpower|interview|document}?filters','GET /reports/{type}?format=xlsx|pdf|csv • GET /notifications • /master-data/*'];
  return ph('พิมพ์เขียวระบบ','โครงสร้างฐานข้อมูลและ API สำหรับทีมพัฒนาเมื่อต่อยอดเป็นระบบจริง')+card('ฐานข้อมูล (ตารางหลักและความสัมพันธ์)',`<div class="tw"><table class="t"><thead><tr><th>ตาราง</th><th>ฟิลด์สำคัญ / FK</th></tr></thead><tbody>${T.map(([a,b])=>`<tr><td><b style="font-weight:500">${esc(a)}</b></td><td class="sm">${esc(b)}</td></tr>`).join('')}</tbody></table></div>`)+`<div style="margin-top:16px">${card('REST API',`<div class="code">${API.map(esc).join('\n')}</div>`)}</div><div style="margin-top:16px">${card('หลักการที่ต้องคงไว้',`<ul style="margin:0;padding-left:18px;line-height:1.9"><li>ตัดสินใจเรื่องบัญชีห้ามรับ, การจ้าง, ปฏิเสธขั้นสุดท้าย, ค่าจ้าง ต้องมีผู้ใช้ที่มีสิทธิ์กดยืนยันเสมอ — คะแนนจับคู่เป็นคำแนะนำเท่านั้น</li><li>แยก internal_note กับ applicant_visible_message ในระดับตาราง และ API ฝั่งผู้สมัครไม่ส่งฟิลด์ภายในออกไปเลย</li><li>ลบแบบเก็บประวัติ (archived_at) — ห้ามลบบันทึกการใช้งานและ status_history</li><li>ด่านตรวจก่อนส่งลงหน่วยงาน และการจำกัดจำนวนผู้จองต่อรอบ ต้องบังคับที่เซิร์ฟเวอร์ ไม่ใช่แค่หน้าจอ</li><li>PDPA: เก็บ consent_version, วันที่, วัตถุประสงค์, การถอนความยินยอม, ระยะเวลาเก็บข้อมูล และบันทึกการเข้าถึง</li></ul>`)}</div>`}

function navCount(r){
  const P=S.cands.filter(c=>inScope(cur(c).co));
  if(r==='apps')return P.filter(c=>cur(c).status==='new').length;
  if(r==='today')return S.bookings.filter(b=>slotOf(b.slot)?.date===d(0)&&['waiting','arrived','late'].includes(b.att)&&inScope(cur(candOf(b.cand)).co)).length;
  if(r==='blr')return S.blr.filter(x=>x.st==='pending').length;
  if(r==='verify')return P.reduce((n,c)=>n+Object.values(c.docs).filter(x=>x.st==='submitted').length,0);
  if(r==='hire'||r==='approvals')return P.filter(c=>cur(c).status==='approval').length+(r==='approvals'?S.mpr.filter(m=>['ส่งคำขอแล้ว','รออนุมัติ'].includes(m.st)).length:0);
  if(r==='rematch')return P.filter(c=>cur(c).status==='notpassed').length;
  return 0;
}

  return S.cands.filter(c=>inScope(cur(c).co)).filter(c=>{const a=cur(c);return [fullName(c),c.en,c.nick,c.phone,c.cid,c.passport,c.id,...c.apps.map(x=>x.no),c.emp?.id,siteOf(a.site).name,posN(a.pos),c.email].join(' ').toLowerCase().includes(q)}).slice(0,8);
}

function vStep(n){const f=P().form;
  if(n===1&&!f.vac)return 'กรุณาเลือกตำแหน่งที่ต้องการสมัคร';
  if(n===2){if(!f.first.trim()||!f.last.trim())return 'กรุณากรอกชื่อและนามสกุล';
    if(f.nat==='ไทย'){if(!cidCheck(f.cid))return 'เลขบัตรประชาชนไม่ถูกต้อง (13 หลัก)'}else if(!/^[A-Z0-9]{6,12}$/i.test(f.passport))return 'กรุณากรอกเลข หนังสือเดินทาง ให้ถูกต้อง';
    if(!f.dob)return 'กรุณาระบุวันเกิด';const age=Math.floor((TODAY-pd(f.dob))/31557600000);if(age<18||age>65)return 'อายุผู้สมัครต้องอยู่ระหว่าง 18–65 ปี';
    if(f.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email))return 'รูปแบบอีเมลไม่ถูกต้อง'}
  if(n===3){if(!f.addr.dist.trim()||!f.addr.prov.trim())return 'กรุณากรอกอำเภอและจังหวัด';if(f.addr.zip&&!/^\d{5}$/.test(f.addr.zip))return 'รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก';
    if(!f.emer.name.trim()||!phoneOk(f.emer.phone.replace(/\D/g,'')))return 'กรุณากรอกชื่อและเบอร์ผู้ติดต่อฉุกเฉินให้ถูกต้อง'}
  if(n===7&&!f.start)return 'กรุณาระบุวันที่พร้อมเริ่มงาน';
  if(n===9&&!(f.ok1&&f.ok2&&f.ok3))return 'กรุณายืนยันข้อมูลและให้ความยินยอมครบทั้ง 3 ข้อ';

  if(n===5)body=(f.exp.length?'':`<p class="muted" style="margin-top:0">ไม่มีประสบการณ์ก็สมัครได้ กด “ถัดไป” ได้เลย</p>`)+f.exp.map((e,i)=>`<div class="pc"><div class="row"><b>งานที่ ${i+1}</b><span class="sp"></span><button class="btn s" onclick="A.pDel('exp',${i})">ลบ</button></div><div class="stack" style="margin-top:8px">${fi('บริษัท',`exp.${i}.co`)}${fi('ตำแหน่ง',`exp.${i}.pos`)}<div class="fg">${fi('เริ่มงาน',`exp.${i}.start`,'month')}${fi('ออกจากงาน',`exp.${i}.end`,'month')}</div>${fi('เงินเดือน/ค่าจ้าง',`exp.${i}.salary`,'text',{im:'numeric'})}${fi('ลักษณะงาน',`exp.${i}.desc`)}${fi('สาเหตุที่ออก',`exp.${i}.reason`)}<div class="fg">${fi('ชื่อผู้อ้างอิง',`exp.${i}.ref`)}${fi('เบอร์ผู้อ้างอิง',`exp.${i}.refPh`,'tel',{im:'tel'})}</div></div></div>`).join('')+`<button class="btn pbtn" onclick="A.pAdd('exp')">+ เพิ่มประวัติการทำงาน</button>`;
  if(n===6)body=`<p class="muted" style="margin-top:0">แตะเลือกทักษะที่มี (เลือกได้หลายข้อ)</p><div class="tg">${SKILLS.map(s=>`<label><input type="checkbox" ${f.skills.includes(s)?'checked':''} onchange="${on(`A.pSkill(${J(s)},this.checked)`)}"><span>${esc(s)}</span></label>`).join('')}</div>
    <div class="stack" style="margin-top:14px">${fs('ใบขับขี่','lic',['ไม่มี','รถจักรยานยนต์','รถยนต์','รถยนต์และจักรยานยนต์','รถบรรทุก'])}${fi('ภาษาที่ใช้ได้','langs')}${fi('คอมพิวเตอร์ / โปรแกรม','comp')}${fi('เครื่องมือ / เครื่องจักรที่ใช้เป็น','equip')}${fi('ใบประกาศ / ใบอนุญาตวิชาชีพ','cert')}</div>`;
  if(n===7)body=`${ft('ทำงานเป็นกะได้','shift')}${ft('ทำกะกลางคืนได้','night')}${ft('ทำ OT ได้','ot')}${ft('ทำงานวันหยุดได้','holiday')}${ft('เดินทาง/ย้ายหน่วยงานได้','travel')}
    <div class="stack" style="margin-top:12px">${fs('ยานพาหนะ','vehicle',['ไม่มี','จักรยานยนต์','รถยนต์'])}${fs('ที่พัก','accom',['มีที่พักเอง','ต้องการที่พัก'])}${fs('พื้นที่ที่สะดวกทำงาน','pref',AREAS)}${fi('พร้อมเริ่มงานวันที่','start','date',{req:1})}${fi('ค่าจ้างที่คาดหวัง (บาท)','expect','text',{im:'numeric',ph:v?String(v.wage):''})}</div>`;
  if(n===8){const tmp={nat:f.nat};const L=reqDocs(tmp,v?.pos);
    body=`<p class="muted" style="margin-top:0">ถ่ายรูปหรือแนบไฟล์ได้ทันที (${esc(S.settings.fileTypes)} ไม่เกิน ${S.settings.maxMB} MB) — ยังไม่มีเอกสารก็ส่งใบสมัครก่อนได้ แล้วค่อยส่งเพิ่มภายหลัง</p>${L.map(k=>`<div class="pc" style="padding:12px 14px"><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><b style="font-weight:500">${esc(DOCS[k])}</b><div class="sm ${f.docs[k]?'':'muted'}">${f.docs[k]?'✓ '+esc(f.docs[k]):'ยังไม่แนบ'}</div></div></div><div style="margin-top:8px">${upBtns(k,'pUpF')}</div></div>`).join('')}`}
  if(n===9){const r=(l,x)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted sm" style="width:110px">${esc(l)}</span><span style="flex:1">${esc(x||'–')}</span></div>`;const tmp={nat:f.nat};const L=reqDocs(tmp,v?.pos);
    body=`<div class="pc">${r('ตำแหน่ง',v?`${posN(v.pos)} • ${siteOf(v.site).name}`:'')}${r('ชื่อ',`${f.first} ${f.last}${f.nick?` (${f.nick})`:''}`)}${r(f.nat==='ไทย'?'เลขบัตร':'หนังสือเดินทาง',pMask(f.cid||f.passport))}${r('วันเกิด',f.dob?fD(f.dob):'')}${r('เบอร์โทร',f.phone)}${r('ที่อยู่',`${f.addr.no} ${f.addr.sub} ${f.addr.dist} ${f.addr.prov}`)}${r('การศึกษา',f.edu.map(e=>e.level).join(', '))}${r('ประสบการณ์',f.exp.length?f.exp.map(e=>e.pos||e.co).join(', '):'ไม่มี')}${r('ทักษะ',f.skills.join(', '))}${r('เริ่มงานได้',fD(f.start))}${r('เอกสาร',`แนบแล้ว ${L.filter(k=>f.docs[k]).length} / ${L.length}`)}</div>
    <div class="row" style="gap:6px">${[2,3,7,8].map(s=>`<button class="btn s" onclick="A.pGo(${s})">แก้ไข${STEPS[s-1].split('และ')[0]}</button>`).join('')}</div>
    <div class="pc" style="margin-top:12px">${ft('ข้าพเจ้ายืนยันว่าข้อมูลทั้งหมดถูกต้องและเป็นความจริง','ok1')}${ft(`ยินยอมตามนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ฉบับ ${S.settings.consentVer}`,'ok2')}${ft('ยินยอมให้บริษัทใช้ข้อมูลเพื่อการสมัครงาน การคัดเลือก และการติดต่อกลับ','ok3')}<p class="sm muted" style="margin-bottom:0">ถอนความยินยอมได้ทุกเมื่อที่เมนูโปรไฟล์</p></div>`}
  return `<div class="steps" aria-label="ขั้นตอนที่ ${n} จาก 9">${STEPS.map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>
   <div class="sm muted">ขั้นตอน ${n} / 9</div><h2 style="margin:2px 0 12px">${STEPS[n-1]}</h2>${body}
   <div class="stack" style="margin-top:16px">${n<9?`<button class="btn p pbtn" onclick="A.pNext()">ถัดไป</button>`:`<button class="btn p pbtn" onclick="A.pSubmit()">ส่งใบสมัคร</button>`}
   <div class="row" style="gap:8px;flex-wrap:nowrap">${n>1?`<button class="btn" style="flex:1;min-height:44px" onclick="A.pPrev()">ย้อนกลับ</button>`:''}<button class="btn" style="flex:1;min-height:44px" onclick="A.pDraft()">บันทึกร่าง</button></div></div>`}

A.pSubmit=()=>{const p=P(),f=p.form;for(let i=1;i<=9;i++){const e=vStep(i);if(e){p.step=i;render();toast(e,'bad');return}}
  const v=vacOf(f.vac);const idn=f.nat==='ไทย'?f.cid:f.passport.toUpperCase();
  // duplicate check: Citizen ID / หนังสือเดินทาง / โทรศัพท์ / อีเมล / เต็ม Name + DOB
  const dup=S.cands.find(c=>(idn&&(c.cid===idn||c.passport===idn))||c.phone===f.phone||(f.email&&c.email===f.email)||(`${c.first} ${c.last}`===`${f.first.trim()} ${f.last.trim()}`&&c.dob===f.dob));
  const blHit=S.blacklist.find(b=>b.cid===idn)||(dup&&(dup.blacklisted||['blacklisted','blacklist_review'].includes(cur(dup).status)));
  let c=dup,created=false;
  if(!c){c={id:nextId('APP'),first:f.first.trim(),last:f.last.trim(),en:`${f.enF} ${f.enL}`.trim()||'-',nick:f.nick,gender:f.gender,nat:f.nat,cid:f.nat==='ไทย'?f.cid:'',passport:f.nat==='ไทย'?'':idn,dob:f.dob,phone:f.phone,line:f.line,email:f.email,
      area:AREAS.find(a=>(f.addr.dist+f.addr.sub).includes(a))||f.pref,prefArea:f.pref,source:f.source,rec:v.rec,skills:f.skills,night:f.night,ot:f.ot,holiday:f.holiday,vehicle:f.vehicle,expect:+f.expect||v.wage,start:f.start,
      edu:f.edu.filter(e=>e.level).map(e=>({level:e.level,inst:e.inst,major:e.major,year:e.year,gpa:e.gpa})),
      exp:f.exp.filter(e=>e.co||e.pos).map(e=>({co:e.co,pos:e.pos,yrs:e.start&&e.end?Math.max(0,Math.round((new Date(e.end)-new Date(e.start))/31557600000)):0,reason:e.reason,salary:e.salary,ref:e.ref,refPh:e.refPh})),
      addr:{...f.addr,same:f.same,cur:f.curAddr},emer:{...f.emer},height:f.height,weight:f.weight,marital:f.marital,lic:f.lic,accom:f.accom,
      docs:{},noShow:0,blacklisted:false,apps:[],tl:[],notes:[],msgs:[],comms:[],offer:null,onb:null,hire:null,emp:null,consent:{ver:S.settings.consentVer,at:now(),purpose:'การสมัครงานและคัดเลือก'},created:now()};
    S.cands.push(c);created=true}
  const a={no:`${c.id}-${c.apps.length+1}`,pos:v.pos,co:v.co,site:v.site,vac:v.id,status:'new',created:now(),hist:[{from:'',to:'new',by:'ผู้สมัคร',at:now(),remark:created?'สมัครผ่าน พอร์ทัลผู้สมัคร':'สมัครซ้ำ — ผูกกับ ผู้สมัคร เดิม'}],result:null,reasons:[],eval:null};
  if(!created&&cur(c)&&!['notpassed','talent','closed'].includes(cur(c).status)){a.hist[0].remark+=' (มีใบสมัครเดิมค้างอยู่)'}
  c.apps.push(a);
  reqDocs(c,v.pos).forEach(k=>{if(f.docs[k])c.docs[k]={st:'submitted',no:'',file:f.docs[k],up:now(),exp:null,note:''};else if(!c.docs[k])c.docs[k]={st:'none'}});
  tl(c,`สมัครงานตำแหน่ง${posN(v.pos)} (${f.source}) ผ่าน พอร์ทัลผู้สมัคร`);log('ส่งใบสมัคร',a.no,'','ใหม่',`ความยินยอม ${S.settings.consentVer}`);
  notify(`ผู้สมัครใหม่: ${fullName(c)} (${posN(v.pos)})`);act(`ผู้สมัครใหม่: ${fullName(c)} → ${posN(v.pos)}`);
  if(!created){notify(`พบ ผู้สมัคร เดิม: ${fullName(c)} (${c.id}) — ผูกใบสมัครใหม่กับโปรไฟล์เดิม`,'warn');tl(c,'ตรวจข้อมูลซ้ำ: พบ ผู้สมัคร เดิม ระบบไม่สร้างโปรไฟล์ซ้ำ')}
  if(blHit){notify(`พบผู้สมัครในบัญชีห้ามรับ: ${fullName(c)} — ${a.no} (ต้องให้ผู้จัดการฝ่ายบุคคล พิจารณา)`,'bad');log('ตรวจพบบัญชีห้ามรับ',a.no,'','พบในบัญชีห้ามรับ','ตรวจจากเลขบัตร/ประวัติเดิม');a.blFlag=true;c.notes.unshift({at:now(),by:'ระบบ',text:'⚠ พบผู้สมัครในบัญชีห้ามรับ — ห้ามลบประวัติเดิม ส่งให้ผู้จัดการฝ่ายบุคคล พิจารณา'})}
  delete S.drafts[f.phone];c.msgs.unshift({at:now(),by:'ระบบ',text:`ได้รับใบสมัครเลขที่ ${a.no} แล้ว ทีมงานจะตรวจสอบภายใน ${S.settings.slaNewHrs} ชั่วโมง`});
  Object.assign(p,{cand:c.id,form:null,tab:'home',done:a.no,preVac:null});save();render();toast('ส่งใบสมัครเรียบร้อย','ok')};

/* existing profile: apply another position */
A.pApply=vid=>{const c=pc(),v=vacOf(vid);A.confirm('สมัครตำแหน่งนี้',`สมัคร ${posN(v.pos)} (${esc(siteOf(v.site).name)}) โดยใช้ข้อมูลและเอกสารเดิมทั้งหมด ไม่ต้องกรอกใหม่`,'pDoApply',[vid],{ok:'สมัคร'})};
A.pDoApply=vid=>{const c=pc(),v=vacOf(vid);const a={no:`${c.id}-${c.apps.length+1}`,pos:v.pos,co:v.co,site:v.site,vac:v.id,status:'new',created:now(),hist:[{from:'',to:'new',by:'ผู้สมัคร',at:now(),remark:'สมัครเพิ่มจากโปรไฟล์เดิม'}],result:null,reasons:[],eval:null};c.apps.push(a);
  reqDocs(c,v.pos).forEach(k=>{if(!c.docs[k])c.docs[k]={st:'none'}});tl(c,`สมัครเพิ่มตำแหน่ง${posN(v.pos)} จากโปรไฟล์เดิม`);notify(`ผู้สมัครเดิมสมัครตำแหน่งใหม่: ${fullName(c)} (${posN(v.pos)})`);act(`สร้างใบสมัครใหม่จากโปรไฟล์เดิม: ${fullName(c)} → ${posN(v.pos)}`);log('ส่งใบสมัคร',a.no,'','ใหม่','ใช้โปรไฟล์เดิม');
  if(S.blacklist.some(b=>b.cid===(c.cid||c.passport))){notify(`พบผู้สมัครในบัญชีห้ามรับ: ${fullName(c)} — ${a.no}`,'bad');a.blFlag=true}
  P().tab='home';P().done=a.no;done('ส่งใบสมัครแล้ว')};
A.pOffer=yes=>{const c=pc();acceptOffer(c,yes);P().tab=yes?'interview':'home';render();toast(yes?'สร้างใบสมัครใหม่แล้ว กรุณาเลือกวันสัมภาษณ์':'ขอบคุณสำหรับคำตอบ',yes?'ok':'')};

/* interview */
A.pPick=id=>{P().pick=id;render()};
A.pConf=()=>{if(!P().pick){toast('กรุณาเลือกรอบสัมภาษณ์','bad');return}P().conf=true;render();const b=$('.pb');if(b)b.scrollTop=0};
A.pBook=()=>{const p=P(),r=bookSlot(p.cand,p.pick);if(!r.ok){p.conf=false;p.pick=null;done(r.msg,'bad');return}p.conf=false;p.pick=null;done(`ยืนยันนัดแล้ว เลขที่ ${r.b.id}`)};
const slotStart=sl=>{const [h,m]=sl.start.split(':');const x=pd(sl.date);x.setHours(+h,+m);return x};
A.pCheckin=bid=>{const b=S.bookings.find(x=>x.id===bid),sl=slotOf(b.slot),c=candOf(b.cand);
  if(sl.date!==d(0)){toast('เช็คอินได้เฉพาะวันนัด ที่จุดรับสมัคร','bad');return}
  const late=Date.now()>slotStart(sl).getTime()+15*6e4;b.att=late?'late':'arrived';b.checkin=now();b.arrive=now();
  log('QR เช็คอิน',b.id,'รอสัมภาษณ์',ATT[b.att][0],'สแกน QR ที่จุดรับสมัคร');tl(c,`เช็คอินสัมภาษณ์ด้วย QR (${ATT[b.att][0]})`);notify(`เช็คอิน: ${fullName(c)} — ${ATT[b.att][0]}`,late?'warn':'ok');act(`เช็คอินสัมภาษณ์: ${fullName(c)} (${ATT[b.att][0]})`);
  done(late?'บันทึกเวลามาถึงแล้ว (มาช้ากว่ากำหนด)':'เช็คอินเรียบร้อย กรุณารอเรียกคิว')};
A.pResched=bid=>A.confirm('ขอเปลี่ยนวันสัมภาษณ์','นัดเดิมจะถูกยกเลิก แล้วเลือกวันใหม่ได้ทันที การเลื่อนล่วงหน้าไม่นับเป็น ไม่มาตามนัด','pDoResched',[bid],{codes:['ติดธุระส่วนตัว','ติดงานเดิม','เดินทางไม่สะดวก','เจ็บป่วย','อื่น ๆ'],ok:'ยืนยันเลื่อนนัด'});
A.pDoResched=(bid,o)=>{const b=S.bookings.find(x=>x.id===bid),c=candOf(b.cand),a=c.apps.find(x=>x.no===b.app);const sl=slotOf(b.slot);
  b.att='resched';b.resched=(b.resched||0)+1;b.reason=o.code;b.hist.push({from:sl.date+' '+sl.start,at:now(),reason:o.code});
  setSt(c,a,'eligible',`ผู้สมัครขอเลื่อนนัด (${o.code}) — ไม่นับเป็น ไม่มาตามนัด`);notify(`ผู้สมัครขอเลื่อนนัด: ${fullName(c)} (${fDay(sl.date)} ${sl.start})`,'warn');act(`เลื่อนนัดสัมภาษณ์: ${fullName(c)}`);
  P().tab='interview';done('ยกเลิกนัดเดิมแล้ว กรุณาเลือกวันใหม่')};

/* documents & e-sign */
A.pUp=(k,inp)=>{const f=inp.files&&inp.files[0];if(!f)return;const e=fileOk(f);if(e){toast(e,'bad');inp.value='';return}
  const c=pc(),doc=c.docs[k]||(c.docs[k]={st:'none'});const old=docSt(doc);Object.assign(doc,{st:'submitted',file:f.name,up:now(),note:'',by:'',vat:null});if(old==='expired'||old==='expiring')doc.exp=null;
  log('ผู้สมัครส่งเอกสาร',`${c.id}/${DOCS[k]}`,DST[old][0],'ส่งแล้ว',f.name);tl(c,`อัปโหลด ${DOCS[k]}`);notify(`อัปโหลดเอกสาร: ${fullName(c)} — ${DOCS[k]}`);act(`ผู้สมัครส่งเอกสาร: ${fullName(c)} ส่ง${DOCS[k]}`);
  const a=cur(c);if(a.status==='docpending'&&reqDocs(c,a.pos).every(x=>docSt(c.docs[x])!=='none'&&!['correction','rejected'].includes(docSt(c.docs[x])))){notify(`เอกสารครบ รอตรวจ: ${fullName(c)}`,'ok')}
  done(`ส่ง${DOCS[k]}แล้ว รอเจ้าหน้าที่ตรวจ`)};
A.pSign=code=>{P().sign=code;render();const b=$('.pb');if(b)b.scrollTop=0};
